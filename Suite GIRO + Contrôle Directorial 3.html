<script type="text/plain" id="mod-giro"><!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIRO — Gestion des Incidents de Risque Opérationnel</title>
<style>
/* ============================================================
   GIRO — Gestion des Incidents de Risque Opérationnel
   Palette : vert profond / or, typographie système (offline-safe)
   ============================================================ */

:root{
  --ink:#1b2420;
  --ink-soft:#4b5750;
  --paper:#f7f5ef;
  --paper-raised:#ffffff;
  --line:#dcd8c8;
  --green-900:#0d3d2c;
  --green-800:#124f39;
  --green-700:#186847;
  --green-600:#1f7f56;
  --green-100:#e2ede5;
  --gold-600:#b9862f;
  --gold-500:#c9a227;
  --gold-100:#f3e9cc;
  --red-600:#a4392c;
  --red-100:#f6e2de;
  --amber-600:#b5762a;
  --amber-100:#f4e6cf;
  --focus:#0d3d2c;
  --radius:6px;
  --shadow:0 1px 2px rgba(20,30,22,.08), 0 6px 20px -8px rgba(20,30,22,.18);
  font-size:16px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",ui-serif,serif;
  font-weight:600;
  color:var(--green-900);
  margin:0 0 .35em;
}
a{color:var(--green-800);}
button, input, select, textarea{font-family:inherit;font-size:.95rem;}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:var(--green-900);
  color:#f4f1e6;
  display:flex;align-items:center;gap:.75rem;
  padding:.6rem 1rem;
  position:sticky;top:0;z-index:40;
  box-shadow:var(--shadow);
}
.topbar .brand{
  display:flex;align-items:center;gap:.6rem;
  font-family:Georgia,ui-serif,serif;font-weight:700;font-size:1.05rem;
  letter-spacing:.2px;
}
.brand .mark{
  width:30px;height:30px;border-radius:7px;
  background:linear-gradient(155deg,var(--gold-500),var(--gold-600));
  color:var(--green-900);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85rem;font-family:Georgia,serif;
  flex:none;
}
.topbar .spacer{flex:1;}
.topbar .status-pill{
  font-size:.72rem;padding:.25rem .55rem;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  color:#e7e2cd;white-space:nowrap;
}
.topbar button.icon-btn{
  background:transparent;border:1px solid rgba(255,255,255,.25);
  color:#f4f1e6;border-radius:var(--radius);padding:.4rem .65rem;
  cursor:pointer;font-size:.82rem;display:flex;align-items:center;gap:.35rem;
  transition:background .15s;
}
.topbar button.icon-btn:hover{background:rgba(255,255,255,.12);}

main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:1.25rem 1rem 4rem;}

/* ---------- Cards / sections ---------- */
.card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:1.25rem 1.4rem;
  margin-bottom:1.1rem;
}
.section-head{
  display:flex;align-items:baseline;gap:.6rem;
  border-bottom:2px solid var(--green-900);
  padding-bottom:.5rem;margin-bottom:1rem;
}
.section-head .num{
  font-family:Georgia,serif;font-weight:700;color:var(--gold-600);
  font-size:1.1rem;
}
.section-head h2{font-size:1.05rem;margin:0;}
.section-sub{
  font-size:.82rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;
  margin:1.2rem 0 .6rem;font-weight:600;border-left:3px solid var(--gold-500);padding-left:.5rem;
}

/* ---------- Form grid ---------- */
.grid{display:grid;gap:.85rem;}
.g-2{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:1fr 1fr 1fr;}
.g-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:760px){.g-2,.g-3,.g-4{grid-template-columns:1fr;}}

.field{display:flex;flex-direction:column;gap:.3rem;}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-soft);}
.field .hint{font-size:.72rem;color:#8a8272;}
.field.required label::after{content:" *";color:var(--red-600);}

input[type=text], input[type=number], input[type=date], select, textarea{
  border:1px solid var(--line);border-radius:5px;
  padding:.5rem .6rem;background:#fff;color:var(--ink);
  width:100%;
}
textarea{resize:vertical;min-height:5.5em;}
input:focus, select:focus, textarea:focus{
  outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus);
}
input[readonly], .readonly-box{
  background:var(--green-100);border-color:#c6dbcd;color:var(--green-900);font-weight:600;
}
.help-box{
  background:var(--gold-100);border:1px solid #e6d4a0;border-radius:5px;
  padding:.55rem .7rem;font-size:.8rem;color:#5c4720;margin-top:.15rem;
  display:none;
}
.help-box.show{display:block;}

/* ---------- Buttons ---------- */
.btn{
  border-radius:5px;padding:.5rem .9rem;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;font-weight:600;font-size:.85rem;
  display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;
}
.btn:hover{border-color:var(--green-700);}
.btn-primary{background:var(--green-800);border-color:var(--green-800);color:#fff;}
.btn-primary:hover{background:var(--green-700);}
.btn-gold{background:var(--gold-500);border-color:var(--gold-600);color:var(--green-900);}
.btn-gold:hover{background:var(--gold-600);}
.btn-danger{background:#fff;border-color:var(--red-600);color:var(--red-600);}
.btn-danger:hover{background:var(--red-100);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--green-800);}
.btn-sm{padding:.32rem .6rem;font-size:.76rem;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem;}

/* ---------- Repeatable tables ---------- */
.rep-table{width:100%;border-collapse:collapse;margin-bottom:.6rem;}
.rep-table th{
  text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);border-bottom:1px solid var(--line);padding:.4rem .4rem;
}
.rep-table td{padding:.4rem;vertical-align:top;border-bottom:1px solid #eeead9;}
.rep-table tr:last-child td{border-bottom:none;}
.rep-table .ref-cell{font-weight:700;color:var(--gold-600);white-space:nowrap;width:3.2em;}
.rep-table .row-actions{text-align:right;white-space:nowrap;width:2.5em;}
.rep-table input, .rep-table select, .rep-table textarea{font-size:.85rem;padding:.4rem;}
.rep-table textarea{min-height:3em;}

.chip{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.15rem .5rem;border-radius:99px;font-size:.72rem;font-weight:700;
}
.chip-1{background:#e3f0e6;color:#276b3f;}
.chip-2{background:#eef2c9;color:#6b6b1f;}
.chip-3{background:var(--amber-100);color:var(--amber-600);}
.chip-4{background:#f9dcc0;color:#b1591b;}
.chip-5,.chip-6{background:var(--red-100);color:var(--red-600);}

/* ---------- Financial table ---------- */
.fin-table{width:100%;border-collapse:collapse;}
.fin-table th{
  text-align:left;font-size:.7rem;text-transform:uppercase;color:var(--ink-soft);
  padding:.4rem;border-bottom:1px solid var(--line);
}
.fin-table td{padding:.45rem .4rem;border-bottom:1px solid #eeead9;}
.fin-table .label-cell{font-weight:600;width:15em;}
.fin-table .computed-row td{background:var(--gold-100);font-weight:700;}
.fin-table input[type=number]{text-align:right;}

/* ---------- Registry / list view ---------- */
.registry-toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;}
.registry-toolbar input[type=search]{flex:1;min-width:200px;}
.registry-list{display:flex;flex-direction:column;gap:.55rem;}
.reg-item{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:.8rem 1rem;display:flex;align-items:center;gap:.8rem;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .1s;
}
.reg-item:hover{transform:translateY(-1px);border-color:var(--green-700);}
.reg-item .ref{font-family:Georgia,serif;font-weight:700;color:var(--green-900);min-width:9em;}
.reg-item .titre{flex:1;font-weight:600;}
.reg-item .meta{font-size:.76rem;color:var(--ink-soft);}
.status-badge{
  font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  padding:.2rem .55rem;border-radius:99px;
}
.status-brouillon{background:#e9e6da;color:#6b6455;}
.status-soumis{background:var(--gold-100);color:#7a5c17;}
.status-en_analyse{background:#dbe6f2;color:#2b567f;}
.status-valide_n2{background:var(--green-100);color:var(--green-800);}
.status-cloture{background:#e2e2e2;color:#555;}
.status-rejete{background:var(--red-100);color:var(--red-600);}

.empty-state{
  text-align:center;padding:3rem 1rem;color:var(--ink-soft);
}
.empty-state .mark{font-size:2.4rem;margin-bottom:.5rem;}

/* ---------- Wizard steps ---------- */
.steps{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.step-pill{
  flex:1;min-width:140px;text-align:center;padding:.55rem .5rem;border-radius:5px;
  background:#efece0;color:var(--ink-soft);font-weight:700;font-size:.78rem;cursor:pointer;
  border:1px solid var(--line);
}
.step-pill.active{background:var(--green-800);color:#fff;border-color:var(--green-800);}
.step-pill.done{background:var(--green-100);color:var(--green-800);border-color:#bcd9c6;}

.footer-nav{display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem;}

/* ---------- Login / PIN ---------- */
.pin-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%, #14563d, #0a2e21 70%);
}
.pin-card{
  background:var(--paper-raised);border-radius:10px;padding:2.2rem 2rem;width:min(360px,90vw);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.5);text-align:center;
}
.pin-card .mark{
  width:52px;height:52px;border-radius:12px;margin:0 auto .8rem;
  background:linear-gradient(155deg,var(--gold-500),var(--gold-600));
  color:var(--green-900);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-family:Georgia,serif;font-size:1.3rem;
}
.pin-dots{display:flex;justify-content:center;gap:.6rem;margin:1rem 0;}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--green-700);}
.pin-dots span.filled{background:var(--green-700);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;}
.pin-pad button{
  padding:.85rem;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:1.1rem;font-weight:700;cursor:pointer;color:var(--green-900);
}
.pin-pad button:active{background:var(--green-100);}
.pin-error{color:var(--red-600);font-size:.8rem;min-height:1.2em;margin-top:.4rem;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--green-900);color:#f4f1e6;padding:.65rem 1.1rem;border-radius:6px;
  font-size:.85rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;z-index:80;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Print ---------- */
@media print{
  .topbar,.toolbar,.steps,.footer-nav,.no-print{display:none !important;}
  body{background:#fff;}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;}
  main{max-width:100%;padding:0;}
}

::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:#c9c3ac;border-radius:6px;}

.dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.2rem;}
@media(max-width:760px){.dashboard-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:.9rem 1rem;box-shadow:var(--shadow);
}
.kpi .val{font-family:Georgia,serif;font-size:1.5rem;font-weight:700;color:var(--green-900);}
.kpi .lbl{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

</style>
</head>

<script>
// Référentiels extraits de la Fiche de Collecte Incident RO (CBI SA)
const REF = {"lignesMetiers": [{"n1": "Financement d'entreprise", "n2": "Financement des entreprises", "groupe_activites": "Fusions-acquisitions, engagement, privatisations, titrisation, recherche, titres de dette (Etat, haut rendement), actions, prêts consortiaux, introductions en bourse, placements sur le marché secondaire", "beta": 0.18}, {"n1": "Financement d'entreprise", "n2": "Financement des collectivités locales / des administrations publiques", "groupe_activites": null, "beta": null}, {"n1": "Financement d'entreprise", "n2": "Banque d'affaires", "groupe_activites": null, "beta": null}, {"n1": "Financement d'entreprise", "n2": "Service-conseil", "groupe_activites": null, "beta": null}, {"n1": "Activités de marché", "n2": "Vente", "groupe_activites": "Valeurs à revenu fixe, actions, changes, produits de base, crédit, financement, titres pour compte propre, prêts et pensions, courtage, titres de dette, courtage financier", "beta": 0.18}, {"n1": "Activités de marché", "n2": "Tenue de marché", "groupe_activites": null, "beta": null}, {"n1": "Activités de marché", "n2": "Prise de positions pour compte propre", "groupe_activites": null, "beta": null}, {"n1": "Activités de marché", "n2": "Trésorerie", "groupe_activites": null, "beta": null}, {"n1": "Banque de détail", "n2": "Banque de détail", "groupe_activites": "Prêts et dépôts, services bancaires, fiducie et gestion de patrimoine", "beta": 0.12}, {"n1": "Banque de détail", "n2": "Banque privée", "groupe_activites": "Prêts et dépôts, services bancaires, fiducie et gestion de patrimoine, conseil en placement", "beta": null}, {"n1": "Banque de détail", "n2": "Cartes", "groupe_activites": "Cartes de débit/de crédit, cartes d'entreprise privatives/multiprestataires", "beta": null}, {"n1": "Banque Commerciale", "n2": "Banque Commerciale", "groupe_activites": "Financement de projets, immobilier, financement des exportations et du commerce, affacturage, crédit-bail, prêts, garanties et lettres de change", "beta": 0.15}, {"n1": "Paiements et règlements", "n2": "Clientèle extérieure", "groupe_activites": "Paiements et recouvrements, transferts de fonds, compensation et règlement", "beta": 0.12}, {"n1": "Fonctions d'agent", "n2": "Conservation", "groupe_activites": "Dépôts fiduciaires, certificats de titres en dépôt, prêts de titres (clientèle), opérations de sociétés", "beta": 0.18}, {"n1": "Fonctions d'agent", "n2": "Services d'agent (entreprises)", "groupe_activites": "Services d'émission et de paiement", "beta": null}, {"n1": "Fonctions d'agent", "n2": "Services de fiducie (entreprises)", "groupe_activites": null, "beta": null}, {"n1": "Gestion d'actifs", "n2": "Gestion de portefeuille discrétionnaire", "groupe_activites": "Gestion centralisée, séparée, de détail, institutionnelle, fonds communs de placement (à capital fixe/variable) et capital investissement", "beta": 0.15}, {"n1": "Gestion d'actifs", "n2": "Gestion de portefeuille non discrétionnaire", "groupe_activites": "Gestion centralisée, séparée, de détail, institutionnelle, fonds communs de placement (à capital fixe/variable)", "beta": null}, {"n1": "Courtage de détail", "n2": "Courtage de détail", "groupe_activites": "Exécution des ordres et service complet", "beta": 0.12}], "categoriesCBI": [{"n1": "Fraude interne", "n2": "1.1. Activité non autorisée", "n3": "1.1.1 Rogue Trading", "definition": "Activité de trading non autorisée, avec dissimulation ou falsification d'opérations ou d'éléments permettant de valoriser la position, d'apprécier les risques associés ou de les gérer.", "exemples": "Exemples:\n- Trading sur des produits en dehors des autorisations de la hiérarchie, évaluation volontairement erronée d'une position ou dissimulation de transactions. (cf. Cas Kerviel)."}, {"n1": "Fraude interne", "n2": "1.1. Activité non autorisée", "n3": "1.1.2 Autres activités non autorisées", "definition": "Activité non-conforme ne respectant pas la règlementation financière, et/ou sa déclinaison dans des politiques Groupe, entraînant ou pouvant entraîner un préjudice pour le Groupe (Délit d'initié, abus de marché, conflit d'intérêt ...).", "exemples": "Exemples:\n- Délit (hors délit d'initié pour compte du Groupe, qui doit figurer en classe 4)\n- Délit de fausse information\n- Manipulation de cours\n- Conflits d'intérêts\n- Non reporting d'une aggravation des risques alors que les procédures l'imposent"}, {"n1": "Fraude interne", "n2": "1.2. Vol et Fraude (interne)", "n3": "1.2.1 Vol et détournement de valeurs et de biens", "definition": "Vol ou détournement de valeurs (espèces, titres, ...) ou d'autres biens appartenant au Groupe ou à des tiers.", "exemples": "Exemples:\n- Hold-up avec complicité d'un collaborateur (renseignements ou clefs donnés à des malfaiteurs)\n- Vol/détournement d'espèces (simulation d'un vol d'espèces par un client lors d'une manipulation, etc.)\n- Vol d'un laptop, d'un beamer (vidéo projecteur), d'un écran plat, de fournitures\n- Détournement de titres/coupons confiés par un client\n- Atteinte physique à l'encontre des biens de la Banque, commise à l'occasion d'une fraude ou pour faciliter celle-ci\n- Atteinte physique à l'encontre des collègues ou des clients, commise à l'occasion d'une fraude ou pour faciliter celle-ci"}, {"n1": "Fraude interne", "n2": "1.2. Vol et Fraude (interne)", "n3": "1.2.2 Fraude interne sur crédit", "definition": "Falsification, dissimulation ou erreurs volontaires relatives à l'octroi ou la gestion d'un crédit.", "exemples": "Exemples:\n- Fraude interne sur un crédit (accord de crédit frauduleux, accord de crédit de complaisance sur la base de documents falsifiés, etc.).\n- Montage et accord de crédits par un collaborateur à un proche avec prise en compte de données erronées ou falsifiées\n- Signature d'un ordre de prêt par un collaborateur en lieu et place d'un client\n- Falsification du scoring"}, {"n1": "Fraude interne", "n2": "1.2. Vol et Fraude (interne)", "n3": "1.2.3 Fraude sur moyens de paiement.", "definition": "Utilisation frauduleuse des moyens de paiement (chèque, carte, virements) ou détournement de moyens technologiques du Groupe (E-banking, GAB…)", "exemples": "Exemples:\n- Fraude utilisant les moyens de paiement ou détournant les moyens technologiques du Groupe (moyens de paiement, distributeurs de billets, espèces, etc.) impliquant un collaborateur (complicité avec un façonnier fabriquant et détournant des chéquiers, etc.).\n- Fraude sur moyens de paiement par chèque ou carte commise par des collaborateurs (vol et usage de chèques de Banque, etc.).\n- Détournement de chèques émis par le collaborateur ou un de ses proches avant encaissement\n- Duplicata des numéros de cartes bancaires (skimming)\n- Usage par un collaborateur d'une carte bancaire d'une client (carte mal établie, non détruite, non réclamée et restée en agence)\n- Virement frauduleux d'un compte interne vers un compte de tiers\n- Transfert frauduleux commis par des collaborateurs, usurpation d'identité (utilisation de papier à en-tête clientèle pour des ordres de transfert, etc.).\n- Clôture d'un compte d'épargne d'un client par un collaborateur et versement des fonds sur un compte ouvert au nom d'un client fictif."}, {"n1": "Fraude interne", "n2": "1.2. Vol et Fraude (interne)", "n3": "1.2.4 Corruption et escroquerie", "definition": "Demander ou accepter, directement ou par interposition de personnes, un avantage de toute nature, en échange d'un service.\n\nDélit commis par un collaborateur consistant à tromper une personne afin de la convaincre de remettre des valeurs ou des biens, ou de fournir un service.", "exemples": "Exemples:\n- Entente illicite entre un collaborateur et un fournisseur, impliquant un risque de non respect  de cahier  des charges  ou de surfacturation de la prestations au détriment du Groupe.\n- Abus de faiblesse ou de position (procuration extorquée à une personne âgée ou mal voyante, collaborateur ou proche bénéficiaire d'un contrat assurance vie).\n- Chantage exercé sur des clients\n- Corruption d'un collaborateur par un client pour obtenir des prêts.\n- Acceptation de cadeaux au-delà des limites fixées par le Groupe, et non reportée à la hiérarchie.\n- Fraude au commissionnement (placement massif de produits non utilisés par les clients et clôturés, etc.).\n- Fausses notes de frais\n- Fraude au temps de travail\n- Ouverture de compte frauduleuse par un collaborateur (ouverture de compte à des relations personnelles frappées d'interdiction bancaire, etc.).\n- Banque parallèle"}, {"n1": "Fraude interne", "n2": "1.2. Vol et Fraude (interne)", "n3": "1.2.5 Autres fraudes internes", "definition": "Toute autre fraude interne n'entrant pas dans une des catégories ci-dessus", "exemples": "Exemples:\n- Collaborateur qui tient un listing de noms de personnalités clientes de l'agence et des informations confidentielles les concernant\n- Accès non autorisés à bases de données"}, {"n1": "Fraude interne", "n2": "1.2. Vol et Fraude (interne)", "n3": "Nouveau Niveau 3 CBI SA", "definition": "Définition", "exemples": "Exemples"}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.1 Hold-up / Vol avec violence", "definition": "\"Vol avec violence ou menaces, physiques ou morales\n\n\" Vol avec violence ou menaces, physiques ou morales", "exemples": "Exemples:\n- Attaque à la voiture bélier\n- Tiger-kidnapping (Enlèvement dans le but de forcer  quelqu'un  à l'aider  à commettre  un crime, généralement précédé par une longue observation de la victime afin de connaître toutes ses habitudes et ses faiblesses) ."}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.2 Vol et détournement de valeurs et de biens", "definition": "Vol ou détournement, sans violence, de valeurs (espèces, titres, ...) ou autres biens appartenant au Groupe ou à des clients.", "exemples": "Exemples:\n- Vol d'espèces (ex: détournement de fonds par une société de ramassage d'espèces)\n- Vol d'informations/données (avec perte financière)\n- Escroquerie au \"rendez-moi\" lors d'une opération de caisse\n- Vol d'un véhicule lors de sa remise au client (leasing)\n- Vol d'un téléphone/ordinateur de service\n- Vol de courrier\n- Vol de voiture de société\n- Vol de titres physiques\n- Dommage dû à un \"hacking\" des systèmes de sécurité"}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.3 Fraude externe sur crédit", "definition": "Falsification, dissimulation ou erreurs volontaires relatives à l'octroi ou la gestion d'un crédit.", "exemples": "Exemples:\n- Obtention d'un crédit sur la base de justificatifs de revenus surévalués\n- Dissimulation d'endettement, fausse déclaration à l'assurance emprunteur\n- Crédits documentaires: paiement sur la base de faux documents\n- Faillite frauduleuse\n- Fausses garanties / Fraude en matière de sûretés"}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.4 Fraude sur cartes", "definition": "Toute fraude sur tout type de carte (vol de carte ou utilisation frauduleuse de carte).", "exemples": "Exemples:\n- Utilisation frauduleuse de cartes appartenant à une personne.\n- Interception du code et de la carte d'un client\n- Obtention de numéros de cartes bancaires par piratage informatique\n- Skimming (Opération frauduleuse qui consiste à intervenir sur un distributeur et à en modifier certains composants afin de se procurer des informations sur la bande magnétique et le code des cartes bancaires)."}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.5 Fraude sur moyens de paiement par  chèque ou carte", "definition": "Non selectionnable", "exemples": "Non selectionnable"}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.5 Fraude sur chèques", "definition": "Toute fraude sur chèques (précédée ou non de vol)", "exemples": "Exemples:\n- Utilisation frauduleuse de chèques appartenant à une personne décédée\n- Cavalerie\n- Encaissement de chèques volés\n- Chèques falsifiés"}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.6 Fraude sur virement", "definition": "Toute type de fraude sur virements émis sur la base d'ordres falsifiés (ordre papier ou électronique)", "exemples": "Exemples:\n- Virement apocryphe\n- Virement frauduleux par le biais de l'electronic banking (subtilisation de mots de passe)."}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.7 Fraudes sur opérations de titres ou de marché", "definition": "Toute fraudes sur titres, opérations de titres ou de marché", "exemples": "Exemples:\n- Remboursement de titres sur un compte n'appartenant pas au titulaire du portefeuille\n- Perte sur investissement sur fond frauduleux  (Fonds avec actifs fictifs, données erronées sur la communication de gestion du fond)"}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.8 Ouverture de compte frauduleuse", "definition": "Ouverture de compte à l'appui de faux papiers d'identité ou de documents falsifiés.", "exemples": "Exemples:\n- Ouverture de compte avec de fausses attestations (justificatifs de domicile)\n- Ouverture de compte avec de faux bulletins de salaire\n- Ouverture de compte avec des documents d'identité faux ou falsifiés"}, {"n1": "Fraude externe", "n2": "Vol et Fraude (externe)", "n3": "2.1.9 Autres Fraudes externes", "definition": "Toute autre fraude externe n'entrant pas dans les catégories ci-dessus et notamment l'escroquerie et la tromperie", "exemples": "Exemples:\n- Facture fournisseur pour des services inexistants ou surestimés\n- Fraude à l'assurance\n- Fausse monnaie\n- Usurpation d'identité"}, {"n1": "Fraude externe", "n2": "Sécurité des systèmes", "n3": "2.2.1 Atteinte à la sécurité des systèmes informatiques", "definition": "Atteintes aux systèmes informatiques ou téléphoniques, commises dans un but d'enrichissement ou dans le seul but de nuire au Groupe.", "exemples": "Exemples:\n- Espionnage industriel, vol d'informations ou de propriété industrielle\n- Virus informatique\n- Accès frauduleux à un site web du Groupe permettant la diffusion de fausses informations."}, {"n1": "Fraude externe", "n2": "Sécurité des systèmes", "n3": "Nouveau Niveau 3 CBI SA", "definition": "Définition", "exemples": "Exemples"}, {"n1": "Pratiques en matière d’emploi et sécurité sur le lieu de travail", "n2": "Relations de travail", "n3": "3.1.1 Litiges trouvant leur origine dans le contrat de travail", "definition": "Pertes opérationnelles découlant d'un problème dans la gestion de la relation employeur - employé et découlant principalement des litiges liés au recrutement, au contrat de travail, à la gestion des rémunérations, aux avantages du personnel, aux licenciements et départs du personnel.", "exemples": "Exemples:\n-  Tout litige lié à une irrégularité dans le contrat de travail, à une erreur dans la gestion des rémunérations\n-  Documentation erronée du contrat (période d'essai, fonction, niveau hiérarchique, montant de la rémunération...), changement de statut sans accord du collaborateur\n-  Collaborateur sans contrat de travail\n-  Anomalie dans la gestion des rémunérations et des rétributions individuelles\n-  Litiges liés au non-respect d'une disposition réglementaire, conventionnelle ou d'entreprise dans le traitement des rémunérations spécifiques\n-  Attribution ou maintien indu d'un avantage\n-  Réduction significative du bonus non justifiée\n-  Contestation sur l'absence de rémunération variable lors d'un départ\n-  Tout litige portant sur l'assiette de calcul d'une indemnité de départ\n-  Non-respect de la procédure de licenciement\n-  Annulation du recrutement après envoi du contrat ou de la promesse d'embauche signés\n-  Toute pénalité pour non respect d'une disposition réglementaire ou conventionnelle\n-  Litiges liés au non-respect d'une disposition réglementaire, conventionnelle ou d'entreprise dans le traitement des déclarations sociales (CNSS, CRRAE etc...)\n-  Défaillance dans l'attribution ou la gestion des droits ou engagements sociaux\n-  Maintien indu de prestations pour des collaborateurs ayant quitté l'entreprise"}, {"n1": "Pratiques en matière d’emploi et sécurité sur le lieu de travail", "n2": "Relations de travail", "n3": "3.1.2 Incidents dans les relations sociales", "definition": "Pertes opérationnelles subies du fait de grèves ou de mouvements sociaux. Leur bien-fondé est sans incidence.", "exemples": "Exemples:\n-  Grève et mouvement social du personnel du Groupe, empêchant la continuité d'activité au sein des agences et autres lieux de travail\n-  Frais d'organisation d'un transport collectif pour le personnel à l'occasion d'une grève ferroviaire\n-  Engagement d'externes pour assurer le service délaissé par des grévistes\n-  Paiement d'heures supplémentaires pour assurer le service non presté par des grévistes\n-  Frais liés aux renforts de gardiennage pour garantir la sécurité des collaborateurs suite à des mouvements sociaux\n-  Vandalisme interne suite à la grève (<=> le vandalisme externe à l'occasion d'une grève se classe sous 5.1.C)\n-  Dysfonctionnement dans la tenue des IRP (Instances Représentatives du Personnel) ou rupture du dialogue social\n-  Contestation désaccord sur un projet d'organisation de portée locale ou nationale\n-  Interruption de la tenue des réunions des instances représentatives du personnel (réunion du Comité Rémunération, Comité Santé Sécurité au Travail…) ayant pour conséquence le retardement d'un projet\n-  Manque à gagner généré par des mouvements sociaux"}, {"n1": "Pratiques en matière d’emploi et sécurité sur le lieu de travail", "n2": "Sécurité sur le lieu de travail", "n3": "3.2.1 Problème d'hygiène ou de sécurité", "definition": "Pertes opérationnelles découlant de problèmes ou de mesures prises en matière d'hygiène sur le lieu de travail ou de sécurité sur le lieu ou le chemin du travail et qui seraient à charge de ou imputables au Groupe.", "exemples": "Exemples:\n-  Tout litige ou frais liés à un accident d'un membre du personnel sur le lieu ou le chemin du travail ou à une maladie et qui seraient à charge du Groupe\n-  Frais de rapatriement d'urgence de collaborateurs (mesures préventives pour garantir la sécurité)\n-  Épidémie, pollution ou contamination empêchant la continuité de l'activité du Groupe\n-  Amende pour non respect de normes anti-pollution"}, {"n1": "Pratiques en matière d’emploi et sécurité sur le lieu de travail", "n2": "Égalité des droits et discrimination", "n3": "3.3.1 Tout type de discrimination", "definition": "Pertes opérationnelles découlant de tout acte discriminatoire à l'égard des employés ou de tout manquement dans la politique de prévention ou de gestion de tels actes.", "exemples": "Exemples:\n-  Tout litige ou pénalité pour discrimination raciale, religieuse, sexuelle, médicale, par l'âge …\n-  Tout litige ou pénalité pour harcèlement sexuel ou moral"}, {"n1": "Pratiques en matière d’emploi et sécurité sur le lieu de travail", "n2": "Égalité des droits et discrimination", "n3": "Nouveau Niveau 3 CBI SA", "definition": "Définition", "exemples": "Exemples"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Conformité, diffusion d'informations et devoir/obligation fiduciaire", "n3": "4.1.1 Manquements en matière d'adéquation des services et produits d'épargne et/ou d'investissement (misselling)", "definition": "Vente de produits ne correspondant pas aux besoins du client ou contradictoire avec son profil de risque, sont notamment visés  les cas d'excès  au détriment  de clients (ou autres tiers) provoqués lorsque les actes de la banque ne sont pas conformes aux règles communément admises.", "exemples": "Exemples:\n- Sanctions ou dommages et intérêts pour pratiques de vente agressives, défaut d'application de la règle du \"bien vendre\" (aggressive sales)\n- Violation des droits du consommateur\n- Sanctions ou dommages et intérêts pour opérations fictives destinées à générer des commissions indues pour la banque (account churning)\n- Manquement au devoir de s'informer correctement sur les besoins, objectifs et moyens du client et de l'informer correctement sur les produits et services proposés (hors services de conseil visés aux 4.5.A) (suitability/disclosure issue(KYC) + retail consumer disclosure violations)\n- Vendre un produit d'investissement sans tenir compte du profil de risque"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Conformité, diffusion d'informations et devoir/obligation fiduciaire", "n3": "4.1.2 Manquements en matière d'adéquation des services et produits de crédit", "definition": "Non respect des obligations du prêteur.", "exemples": "Exemples:\n- Dommages et intérêts au titre de la responsabilité du prêteur de deniers (lender liability)"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Conformité, diffusion d'informations et devoir/obligation fiduciaire", "n3": "4.1.3 Manquements en matière de gestion de la confidentialité de l'information", "definition": "Défaillances en matière de gestion de la confidentialité des données client.", "exemples": "Exemples:\n- Atteinte à la vie privée de la clientèle (privacy breach)\n- Utilisation abusive d'informations confidentielles (hors délit d'initié visé au 4.2.B) (misuse of confidential info)"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Conformité, diffusion d'informations et devoir/obligation fiduciaire", "n3": "4.1.4 Non respect du mandat de gestion ou autre manquement au devoir fiduciaire", "definition": "Violations en matière fiduciaire ou de mandat confié à la banque ou en matière de conflits d'intérêts.", "exemples": "Exemples:\n- Indemnisation pour non respect du pourcentage agressif/défensif/neutre convenu d'un portefeuille-titres (fiduciary breaches / guidelines violations)\n- Mise en oeuvre tardive du mandat de gestion\n- Indemnisation en matière de conflits d'intérêts pour avoir privilégié un client par rapport à un autre\n- Non respect  des règles  d'investissement en matière  de gestion de fonds\n- Trustee  ne respectant  pas les règles de gestion édictées  par son client\n- Non respect du trust deed, de la part d'un trustee"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Pratiques commerciales ou de place incorrectes", "n3": "4.2.1 Pratiques commerciales inappropriées", "definition": "Actes discutables perpétrés au bénéfice de l'entreprise (et accessoirement au profit du collaborateur via un espoir de bonus ou de promotion) et au préjudice de clients.", "exemples": "Exemples:\n- Amende ou indemnisation pour pratiques commerciales discriminatoires et anti-égalitaires à l'égard d'une certaine catégorie de la population (discrimination / diversity events in marketplace or general public)\n- Indemnisation pour violation de clauses contractuelles (violation of substantive business contractual provisions)\n- Indemnisation pour exécution d'opérations sur le compte d'un client de la propre initiative du collaborateur, sans instruction du client / gestion de fait\n- Indemnisation pour non respect des règles ou des politiques internes de vente"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Pratiques commerciales ou de place incorrectes", "n3": "4.2.2 Pratiques professionnelles inappropriées", "definition": "Actes discutables perpétrés au préjudice d'un tiers non client (l'Etat, un concurrent, le public en général), à l'exclusion des erreurs de reporting social et fiscal (classe 7).\n\nLes pertes subies dues à des actes discutables perpétrés par des tiers non clients au détriment du groupe ne sont pas concernés et se retrouvent en classe 7 sous litiges avec tiers non clients et litiges avec fournisseurs.", "exemples": "Exemples:\n- Sanctions pour abus de position dominante / violation d'une loi anti-trust (antitrust, entente illicite)\n- Sanctions pour délit d'initié commis au nom de l'entreprise (insider trading on firm's account)\n- Sanctions pour manipulation de marché (market manipulation)\n- Sanctions  pour complicité de blanchiment  (money laundering)\n- Sanctions pour activité exercée sans agrément des autorités compétentes ou non-conforme à l'agrément délivré (unlicensed activity)\n- Sanctions liées à des transactions avec des parties non autorisées ou sur liste d'embargo\n- Sanctions liées à des transaction effectuée avec un client dont les fonds ou les actifs sont bloqués par une autorité réglementaire\n- Sanctions pour ne pas avoir annoncé une période fermée / Non respect des règles de contrôle des opérations personnelles des collaborateurs\n- Pénalités pour utilisation d'un software sans payer la licence\n- Pénalités pour infraction au code déontologique, code de conduite\n- Sanctions pour non publication des règles déontologiques ou carences en formation aux règles déontologiques\n- Santions pour autres manquements à la déontologie et à l'éthique, aux réglementations\n- Sanctions pour non-respect des obligations d'actionnaire\n- Sanctions pour défaut d'étanchéité de la muraille de Chine\n- Sanctions pour défaillance dans le reporting de transactions suspectes\n- Sanctions pour transactions avec des contreparties frappées d'embargo"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Services ou produits défectueux", "n3": "4.3.1 Service ou produit défectueux", "definition": "Services ou produits contenant  un vice ou défaut  inhérent, à l'exception des services et produits informatiques (classe 6).", "exemples": "Exemples:\n- Erreur dans le prospectus  d'un produit  d'investissement / documentation marketing  (product defect)\n- Erreur de modélisation,  erreurs dans  la définition,  la conception  ou la mise en oeuvre (model error)\n- Défaillance d'un produit vendu à un client"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Sélection, promotion et exposition au risque", "n3": "4.4.1 Insuffisance dans l'analyse clientèle (due diligence)", "definition": "Manquements dans les due diligences exigées pour l'entrée en relation avec un client ou son maintien en relation.\n\nLes manquements sont occasionnés par négligence ou légèreté.", "exemples": "Exemples:\n- Manquements à la procédure KYC (au sens Anti-Money Laundering / Combatting the Financing of Terrorism)\n- Manquements graves dans l'analyse d'un dossier crédit sans lesquels le crédit n'aurait pas été octroyé (Failure to investigate client per guidelines)"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Sélection, promotion et exposition au risque", "n3": "4.4.2 Dépassement des limites d'exposition sur un client", "definition": "Dépassements par rapport aux limites fixées pour un client  et qui excèdent les pouvoirs de celui qui les a accordés (mais sans franchir la ligne avec la classe 1).\n\nLes dépassements sont occasionnés par négligence ou légèreté.\n\nDéfaut de toute exigence de dépôt de couverture ou de marge ou obligation similaire\n", "exemples": "Exemples:\n- Echec dans processus d'approbation de crédit, vérification de limite avec filiale incorrecte, utilisation incorrecte d'un score\n- Non-respect des règles de couverture de risque pour un portefeuille ou une position, y-compris couverture obligatoire d'un produit de rémunération différée\n- Défaut de toute exigence de dépôt de couverture ou de marge ou obligation similaire (Exceeding client exposure limits)"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Activités de conseil", "n3": "4.5.1 Litiges sur la non- conformité des prestations de conseil à une réglementation en vigueur", "definition": "Il s'agit ici de la notion de \"conseil\" telle qu'elle est reprise dans différentes réglementations.\nA ne pas confondre avec la simple information due au client.\n\nUn litige sur l'efficience de la qualité d'un conseil en investissement fourni par la banque serait traité ici tandis qu'un litige résultant d'une information incomplète donnée au client sur un produit bancaire de base sera traité sous 4.1.A.", "exemples": "Exemples:\n- Conflits sur l'efficience des prestations (disputes over performance of advisory activities)\n- Assigner un junior sur un dossier important alors que l'on avait assuré le client que son dossier serait traité par un senior\n- Évaluation erronée d'un bien immobilier dans le cadre d'un mandat d'expertise confié à la banque"}, {"n1": "Clients  Produits  et  Pratiques commerciales", "n2": "Activités de conseil", "n3": "Nouveau Niveau 3 CBI SA", "definition": "Définition", "exemples": "Exemples"}, {"n1": "Dommages aux actifs corporels", "n2": "Dommages aux actifs corporels", "n3": "5.1.1 Catastrophes / Désastres / Sinistres", "definition": "Incidents découlant de catastrophes naturelles, désastres ou sinistres, affectant les biens et / ou les personnes (collaborateurs compris).\n\nSi la responsabilité du groupe est recherchée pour ne pas avoir pris des mesures de sécurité suffisantes, pour assurer la sécurité du personnel, l'incident est à classer en 3.2.A.", "exemples": "Exemples:\n-  Tout dommage résultant de tsunami, tremblement de terre, innondation, catastrophe aérienne (non terroriste)\n-  Tout dommage résultant d'incendie, de dégâts des eaux, de fuite de gaz\n-  Franchise à charge du groupe suite à un accident avec un véhicule de société"}, {"n1": "Dommages aux actifs corporels", "n2": "Dommages aux actifs corporels", "n3": "5.1.2 Accidents touchant uniquement les personnes (hors collaborateurs)", "definition": "Incidents découlant d'accidents aux clients et autres tiers (autres que collaborateurs) dans les locaux du Groupe.", "exemples": "Exemples:\n\n- Blessure ou dommage accidentel d'un client ou tiers dans les locaux du Groupe (indemnisation d'un client qui glisse en agence sur un sol mouillé)"}, {"n1": "Dommages aux actifs corporels", "n2": "Dommages aux actifs corporels", "n3": "5.1.3 Emeutes, terrorisme et vandalisme", "definition": "Dommages dûs à la guerre, à des émeutes, à des troubles politiques, à des actes de terrorisme et vandalisme, affectant les biens ou les personnes (collaborateurs compris).\n\nSi la responsabilité du groupe est recherchée pour ne pas avoir pris des mesures de sécurité suffisantes, l'incident est à classer en 3.2.A.", "exemples": "Exemples:\n-  Dommages dûs à la guerre, troubles politiques ou actes terroristes (Attentats 11 septembre)\n-  Manifestations sur la voie publique / grève entraînant des actes de dégradation et de vandalisme (Soulèvement populaire des 30 & 31 Octobre)\n"}, {"n1": "Dommages aux actifs corporels", "n2": "Dommages aux actifs corporels", "n3": "Niveau 3 CBI SA", "definition": "Définition", "exemples": "Exemples"}, {"n1": "Interruptions d'activité et défaillance des systèmes", "n2": "Systèmes", "n3": "6.1.1 Indisponibilité ou incident dans la gestion des systèmes informatiques", "definition": "Incidents liés à des problèmes informatiques pilotés en interne.", "exemples": "Exemples:\n-  Irrégularités ou défaillances du hardware / hardware obsolète\n-  Irrégularités ou défaillances du software (licences non renouvelées, logiciels obsolètes...)\n-  Indemnisation client pour retard dans exécution suite aux indisponibilités ou perturbations des systèmes\n-  Bug informatique générant des doublons dans l'exécution d'un ordre\n-  Système ou application arrêté(e) ou totalement indisponible pour un groupe d'utilisateurs (ex : département, agence building, ...) ou pour l'ensemble des utilisateurs\n-  Indisponibilité des GAB\n-  Indisponibilité de système suite à des problèmes électriques\n-  Temps de réponse anormaux provoquant des pertes ou manque a gagner\n-  Retard de mise en œuvre des projets informatiques"}, {"n1": "Interruptions d'activité et défaillance des systèmes", "n2": "Autres interruptions", "n3": "6.2.1 Interruption de l'activité hors informatique", "definition": "Incidents liés à des problèmes relatifs aux infrastructures autres qu'informatiques, entraînant une interruption de l'activité.", "exemples": "Exemples:\n-  Indemnisation client pour retard dans exécution suite à interruption/perturbation d'un service public \n-  Indemnisation client pour retard dans exécution suite à télécoms indisponibles\n-  Indemnisation client pour retard dans exécution d'un ordre suite à un exercice de continuité des activités\n-  Indisponibilité ou problèmes de locaux dus à un vice de construction ou à une installation défectueuse, ou à des grèves extérieures au Groupe (par exemple transports publics)\n-  Autre interruption d'activité d'origine externe au Groupe"}, {"n1": "Interruptions d'activité et défaillance des systèmes", "n2": "Autres interruptions", "n3": "Niveau 3 CBI SA", "definition": "Définition", "exemples": "Exemples"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Initiation des transactions, exécution, et suivi", "n3": "7.1.1 Initialisation des transactions", "definition": "Erreur, retard ou défaillance dans l'analyse préparatoire d'une transaction et dans la vérification de la documentation nécessaire à l'exécution de cette dernière.", "exemples": "Exemples:\n-  Erreur de saisie dans les référentiels autres que clients (titres, données de marché (taux d'intérêt de référence), référentiels produits, ...)\n-  Erreur dans l'établissement, la saisie ou la maintenance des schémas comptables\n-  Décisions d'opérations, de transactions, ou de financement prises sur base d'informations incorrectes\n-  Élaboration, saisie ou collecte de la documentation contractuelle relative à la transaction incomplète, incohérente ou absente\n-  Dépassement des limites / dépassement des pouvoirs non volontaires\n-  Erreur dans l'analyse administrative ou opérationnelle et la préparation de la transaction\n-  Utilisation erronée d'un modèle\n- Mauvaise communication, méprise ou mésentente sur ordres internes ou externes / erreur de routage (mauvaise communication ou méprise sur les ordres transmis entre le responsable de compte ou le gestionnaire de portefeuille et l'équipe d'exécution, transmission d'ordre en dehors des délais, etc.)\n-  Proposition non faite dans les délais"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Initiation des transactions, exécution, et suivi", "n3": "7.1.2 Exécution des transactions", "definition": "Erreur, retard ou défaillance dans la réalisation de toute opération (saisie, paiement et perception de commissions et frais).", "exemples": "Exemples:\n-  Erreur ou retard d'exécution d'une transaction\n-  Erreur dans la saisie, la mise à jour, le chargement ou le transfert d'une transaction\n-  Erreur de cotation ou de pricing (d'une transaction individuelle)\n-  Exécution d'un ordre client confondant quantité et montant\n-  Erreur de manipulation de caisse dans l'activité de guichet\n-  Couverture d'une position de change erronée (Front Office)\n-  Paiement incorrect ou absence de paiement\n-  Facturation concernant un autre client, double facturation ou tardive"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Initiation des transactions, exécution, et suivi", "n3": "7.1.3 Gestion et suivi des transactions", "definition": "Erreur, retard ou défaillance dans la réalisation des activités intervenant après l'exécution de la transaction.", "exemples": "Exemples:\n-  Défaillance dans le suivi des transactions (y compris opérations sur Titres / exercices d'options)\n-  Erreur de confirmation\n-  Erreur dans la gestion des couvertures d'une position ou d'un portefeuille (Middle Office)\n-  Défaut de suivi des besoins de refinancement\n-  Mauvaise gestion d'une garantie /d'un collatéral, erreur d'appel de marge\n-  Erreur ou retard dans la valorisation d'un fonds\n-  Erreur comptable / erreur d'affectation comptable\n-  Mauvaise conservation des documents de transaction / problème d'archivage\n"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Initiation des transactions, exécution, et suivi", "n3": "7.1.4 Défaillance dans la gestion d'un projet non IT", "definition": "Problème de bascule d'organisation mal préparée nécessitant la correction par des ressources externes non prévues", "exemples": "Problème de bascule d'organisation mal préparée nécessitant la correction par des ressources externes non prévues"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Surveillance et notification financière", "n3": "7.2.1 Défaillances et Erreurs liées à  la Fiscalité", "definition": "Erreur, omission ou retard dans les déclarations à l'Administration Fiscale entraînant une perte pour le Groupe.", "exemples": "Exemples:\n-  Pénalités dans le cadre d'un redressement fiscal\n-  Surpaiement d'impôt non récupérable\n-  Non-récupération de crédit d'impôt\n-  Non-déduction de charges déductibles\n-  Erreur de TVA et autres erreurs fiscales\n-  Erreur, omission ou retard sur le traitement de déclarations sociales ou fiscales liées aux ressources humaines\n-  Retard ou erreur dans une déclaration sociale ou fiscale individuelle"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Surveillance et notification financière", "n3": "7.2.2 Erreur, omission ou retard dans le reporting", "definition": "Erreur, omission ou retard de déclaration à une autorité externe.\n\nErreur ou défaillance dans les processus de reporting interne, entraînant une perte financière pour le Groupe.", "exemples": "Exemples:\n-  Défaillance ou absence dans la réconciliation interne / externe\n-  Erreur ou retard dans le reporting du P&L\n-  Erreur, omission ou retard liés à la masse salariale et coûts directs de ressources humaines hors impact ou pénalité fiscale\n-  Erreur, omission ou retard liés aux provisions sociales\n-  Pénalité pour défaillance dans le reporting réglementaire\n-  Pénalité pour manquement de déclaration de dépassement de limites\n-  Pénalité pour défaut de déclaration des réserves à la Banque Centrale\n-  Production de reporting de gestion incorrect ou tardif\n-  Problème ou défaillance dans la planification / le budget"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Entrée en relation et documentation clientèle", "n3": "7.3.1 Absence ou erreur dans la documentation juridique liée à l'entrée en relation", "definition": "Documentation juridique client absente, incomplète ou incohérente recueillie lors de l'entrée en relation. \n\nN'inclue pas la documentation des transactions (classé en 7.1.A)\n\nN'inclue pas la gestion sans mandat / problèmes de pertinence (classés en 4)", "exemples": "Exemples:\n-  Absence ou incohérence (signature absente, rature ou surcharge entraînant la nullité) dans le contrat d'ouverture de compte, de contrat de prêt…\n-  Absence de documents d'identification du client\n-  Absence de document client valant autorisation ou renonciation (procuration, décharge...)"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Gestion des comptes clients", "n3": "7.4.1 Erreurs et défauts sur les données client et le reporting aux clients", "definition": "Erreur ou défaut dans la saisie ou la maintenance des données des référentiels client.\n\nErreur ou retard concernant le reporting client. Autorisation donnée à tort par la banque à une tierce personne non habilitée à effectuer des opérations sur le compte d'un client.", "exemples": "Exemples:\n-  Erreur de saisie des informations relatives au client (adresse, civilité …)\n-  Clôture du compte client par erreur\n-  Erreur ou retard dans les envois des relevés de compte, factures, courriers …\n-  Accès donné au compte de son mari à la femme de celui-ci alors qu'il ne s'agit pas d'un compte joint ou qu'elle n'a pas procuration\n-  Accès donné au compte d'un enfant mineur ou d'un majeur incapable à une personne non désignée comme représentant légal\n-  Accès donné à des comptes gelés par action judiciaire"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Gestion des comptes clients", "n3": "7.4.2 Actifs   clients perdus ou endommagés par négligence", "definition": "Perte d'actifs du client suite à une négligence du Groupe", "exemples": "Exemples:\n-  Chèques ou effets égarés\n-  Perte de documents relatifs a un crédit documentaire entraînant des frais d'emmagasinage de marchandises supplémentaires pour le client\n-  Perte de titres"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Contreparties", "n3": "7.5.1 Défaillance   ou litiges avec une contrepartie", "definition": "Défaillance ou litige avec une contrepartie conduisant à une perte financière pour le Groupe.", "exemples": "Exemples:\n-  Faillite d'une contrepartie\n-  Retard de paiement de la contrepartie en notre faveur"}, {"n1": "7.Exécution, Livraison et Gestion des  Processus", "n2": "Fournisseurs", "n3": "7.6.1 Défaillance ou litige avec un fournisseur", "definition": "Défaillance, litige ou problème de performance avec un fournisseur ou un sous-traitant, ou dans le traitement administratif de son dossier.", "exemples": "Exemples:\n-  Problèmes d'Outsourcing, manquement au SLA\n-  Grève de la Poste\n-  Défaillance dans le traitement administratif des fournisseurs (Non paiement du fournisseur, non récupération d'acompte versé pour une prestation non effectuée)."}], "causes": [{"n1": "1. Acte délibéré", "code": "Ca1", "num": "1.1", "n2": "Divulgation d'informations privilégiées"}, {"n1": "1. Acte délibéré", "code": "Ca2", "num": "1.2", "n2": "Non respect intentionnel des obligations légales envers les salariés"}, {"n1": "1. Acte délibéré", "code": "Ca3", "num": "1.3", "n2": "Pression commerciale amenant le non respect intentionnel des lois"}, {"n1": "1. Acte délibéré", "code": "Ca4", "num": "1.4", "n2": "Mauvaise foi du client"}, {"n1": "1. Acte délibéré", "code": "Ca5", "num": "1.5", "n2": "Syndrome du \"vendeur star\" & Confiance aveugle"}, {"n1": "1. Acte délibéré", "code": "Ca6", "num": "1.6", "n2": "Collusion avec des acteurs internes ou externes"}, {"n1": "1. Acte délibéré", "code": "Ca7", "num": "1.7", "n2": "Acte de malveillance volontaire dans le seul but de nuire"}, {"n1": "1. Acte délibéré", "code": "Ca8", "num": "1.8", "n2": "Difficulté à avouer une erre ntation à des catastrophes naturelles"}, {"n1": "7.Cause exogène (facteur d'environnement)", "code": "Ca70", "num": "7.10", "n2": "Illiquidité des marchés"}], "consequences": [{"n1": "Impacts financiers / exploitation", "n2": "Perte réelle ou directe de valeur", "description": "Diminution directe de la valeur des actifs, des revenus, ou charges supplémentaires (perte financière directe)", "exemples": "o Un détournement de fonds par une fraude interne ou externe\no Une amende à la suite d’un défaut de la réglementation\no Accord de prêt à un client insolvable au moment de réaliser l’opération de prêt (sans avoir réalisé la vérification de son insolvabilité en appliquant les procédures prévues à cet effet)"}, {"n1": "Impacts financiers / exploitation", "n2": "Gain", "description": "Se réfère à un impact financier positif de l’événement de risque. Dans certaines circonstances, un événement de risque opérationnel pourrait engendrer un ‘profit’ pour la banque. Ces ‘profits’ sont aussi une importante source d’information relative à la gestion des risques", "exemples": "o Une erreur de transaction sur les marchés financiers provoque un delta de cours favorable à la Banque.\no Une erreur de paramétrage des conditions tarifaires est en la faveur de la Banque (même si on va rembourser le client a posteriori)"}, {"n1": "Impacts financiers / exploitation", "n2": "Manque à gagner", "description": "Opportunité de gain perdue", "exemples": "o Une erreur opérationnelle fait perdre un client à la Banque\no Un défaut de communication des informations sur un produit (non-respect de la procédure de commercialisation) fait perdre un client à la Banque"}, {"n1": "Impacts financiers / exploitation", "n2": "Quasi-Perte ou Near misses", "description": "Evènements de risque opérationnel qui n’ont pas eu d’impact financier, mais qui auraient pu en avoir un.", "exemples": "o Une tentative de piratage informatique a échoué mais aurait pu avoir un impact financier\no Défaut d’information du client d’informations juridiques obligatoires ou non signature par le client d’un document protégeant la banque\no Erreurs de traitement d’une opération avec un prestataire qui n’applique pas les pénalités associées\no Une erreur opérationnelle qui ne provoque, ni manque à gagner, ni perte mais uniquement une perte de temps ou une insatisfaction clientèle sans perdre le client pour autant\no Non-respect de la réglementation mais n’engendrant pas nécessairement une pénalité"}, {"n1": "Impacts financiers / exploitation", "n2": "Perte potentielle conditionnelle", "description": "Incident dont l’impact financier n’a pas fait l’objet d’une provision comptable et qui ne se matérialisera qu’à la réalisation d’une condition", "exemples": "o Dossier de garantie incomplet qui ne conduira à une perte qu’en cas de défaut du tiers).\no Non-respect de la réglementation avec décision possible d’une amende par le régulateur (lettre de suite ou plan de remédiation soumis par le régulateur)"}, {"n1": "Impacts financiers / exploitation", "n2": "Perte réelle ET Manque à gagner", "description": "Incident qui provoque simultanément une perte réelle et un manque à gagner", "exemples": "o Une amende du régulateur combinée aux départs de plusieurs clients car la réputation de la Banque est affectée.\no Une erreur opérationnelle sur une opération de prêt faisant perdre les intérêts et le client sur la prestation de dépôt (le client quitte la banque)"}, {"n1": "Impacts financiers / exploitation", "n2": "Perte/Dommage aux actifs physiques", "description": "Diminution directe de la valeur d’actifs matériels, y compris les conséquences d’accidents", "exemples": "Dommage, dépréciation d'actifs immobiliers de la banque\nDommage, dépréciation, disparition d'actifs mobiliers ou des biens de la banque\nDépréciation des actifs financiers de la clientèle\nDépréciation des actifs mobiliers  de la clientèle"}, {"n1": "Impacts financiers / exploitation", "n2": "Interruption de processus", "description": "Déroulement du processus stoppé (perte d'efficacité et de temps)", "exemples": null}, {"n1": "Impacts juridiques / réglementaires", "n2": "Sanction Réglementaire", "description": "Pénalités, amendes ou retraits d’agréments", "exemples": null}, {"n1": "Impacts juridiques / réglementaires", "n2": "Conséquence humaine et sociale ", "description": "santé, sécurité des employés ou climat social", "exemples": null}, {"n1": "Impacts juridiques / réglementaires", "n2": "Sanction Juridique", "description": "Assignation civile ou pénale", "exemples": null}, {"n1": "Impacts client", "n2": "Insatisfaction client ", "description": "Dégradation des services fournis aux clients", "exemples": null}, {"n1": "Impacts client", "n2": "Indemnisation du client", "description": "Versement à un client d’un capital principal ou d’intérêts par restitution, ou compensation de l'événement subi", "exemples": null}, {"n1": "Impacts d'image ou réputation", "n2": "Risque d’image", "description": "Impact médiatique", "exemples": null}, {"n1": "Impacts risques financiers et risque de crédit", "n2": "Impact risque de crédit", "description": "Augmentation de la probabilité de défaut ", "exemples": null}, {"n1": "Impacts risques financiers et risque de crédit", "n2": "Impact risque de marché", "description": "Augmentation de la volatilité ou exposition au marché", "exemples": null}, {"n1": "Impacts risques financiers et risque de crédit", "n2": "Impact risque de liquidité", "description": "Augmente le risque de liquidité - trésorerie", "exemples": null}], "echelleImpact": [{"niveau": 1, "libelle": "Faible", "financier": "  Pour la Banque, jusqu'à 500 CFA\n - Si le risque survient, l'impact financier est faible\n - Si le risque survient, il ne bloque pas l'activité", "client": " - Aucun impact client\n - Même si le risque survient, cela ne donne pas lieu à un litige client", "juridique": " - Le thème adressé n'est pas un enjeu réglementaire\n - Faible impact règlementaire", "image": "  - Si le risque survient, il ne met pas en danger la Banque sur sa réputation\n - Même si l'information fuite, elle est peu alarmante et ne sera pas reprise à l'encontre de la Banque"}, {"niveau": 2, "libelle": "Modéré", "financier": "Pour la Banque, entre 500 CFA et 5 KCFA\n - Si le risque survient, l'impact financier est modéré à moyen\n - La perte constatée n'impacte pas les objectifs\n - Si le risque survient, il bloque l'activité sans pour autant avoir un impact sur le PNB journalier (ex : < 1h00)", "client": " - Si le risque survient et qu'il est potentiellement lié à un litige, cela peut se régler à l'amiable\n - Eventuellement, perte du client concerné ou sur un périmètre restreint et non stratégique", "juridique": " - Le thème adressé n'est pas un enjeu réglementaire prioritaire\n- Sanctions/pénalités ne dépassant pas 1000 KCFA", "image": "  - Si le risque survient, il met modérément en danger la Banque sur sa réputation\n - Si l'information est reprise, elle ne remet pas en cause la Banque ; elle ne sera pas reprise par la presse car elle n'a pas un intérêt pour elle \n - Couverture médiatique négative au niveau local"}, {"niveau": 3, "libelle": "Moyen", "financier": "Pour la Banque, entre 5 et 50 KCFA\n - Si le risque survient, l'impact financier est modéré à moyen\n - La perte constatée n'impacte pas les objectifs\n - Si le risque survient, il bloque l'activité sans pour autant avoir un impact sur le PNB journalier (ex : < 1h00)", "client": " - Si le risque survient et qu'il est potentiellement lié à un litige, cela peut se régler à l'amiable\n - Eventuellement, perte du client concerné ou sur un périmètre moyen", "juridique": " - Le thème adressé n'est pas un enjeu réglementaire prioritaire\n- Sanctions/pénalités ne dépassant pas 2500 KCFA", "image": "  - Si le risque survient, il met modérément en danger la Banque sur sa réputation\n - Si l'information est reprise, elle ne remet pas en cause la Banque ; elle ne sera pas reprise par la presse car elle n'a pas un intérêt pour elle \n - Couverture médiatique négative au niveau local"}, {"niveau": 4, "libelle": "Fort", "financier": "Pour la Banque, entre 50 KCFA et 500 KCFA\n - Si le risque survient, l'impact financier est important à élevé\n - La perte constatée est importante\n - Si le risque survient, il bloque l'activité en ayant un impact non négligeable sur le PNB journalier (ex : 4h00)", "client": " - La perte constatée met en danger le client\n  - Si le risque survient et qu'il est potentiellement lié à un litige, une assignation est effectuée par le client à l'encontre de la Banque\n  - Perte d'un portefeuille moyen de clients", "juridique": " - Le thème adressé est un enjeu réglementaire  important\n- Sanctions/pénalités comprises entre 2500 KCFA et 5.000 KCFA\n- Plusieurs courriers de blâmes ou de mise en demeure", "image": "  - Si le risque survient, il peut mettre la Banque en risque de réputation avéré\n - Si l'information est reprise, elle peut faire l'objet d'une campagne de presse négative\n - Couverture médiatique négative prolongée au niveau régional et national"}, {"niveau": 5, "libelle": "Majeur", "financier": "Pour la Banque, entre 500 KCFA et 5MCFA\n - Si le risque survient, l'impact financier est important à élevé\n - La perte constatée est importante\n - Si le risque survient, il bloque l'activité en ayant un impact non négligeable sur le PNB journalier (ex : 4h00)", "client": " - La perte constatée met en danger le client\n  - Si le risque survient et qu'il est potentiellement lié à un litige, une assignation est effectuée par le client à l'encontre de la Banque\n  - Perte d'un portefeuille important de clients", "juridique": " - Le thème adressé est un enjeu réglementaire  important\n- Sanctions/pénalités comprises entre 500 KCFA et 5.000 KCFA\n- Plusieurs courriers de blâmes ou de mise en demeure", "image": "  - Si le risque survient, il peut mettre la Banque en risque de réputation avéré\n - Si l'information est reprise, elle peut faire l'objet d'une campagne <script>
/* ============================================================
   GIRO — Gestion des Incidents de Risque Opérationnel
   Application autonome (offline-first) reproduisant à l'identique
   les fonctions de la Fiche de Collecte Incident RO (Excel CBI SA)
   ============================================================ */

(function(){
"use strict";

/* ---------------------- Utilitaires ---------------------- */
const uniq = arr => [...new Set(arr.filter(v => v !== null && v !== undefined && v !== ""))];
const uid = (p="id") => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const esc = s => (s===undefined||s===null? "": String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMoney = (v, dev="XOF") => {
  const n = parseFloat(v);
  if (isNaN(n)) return "—";
  return n.toLocaleString("fr-FR", {maximumFractionDigits:0}) + " " + dev;
};
const getPath = (obj, path) => path.split(".").reduce((o,k)=> (o ? o[k] : undefined), obj);
const setPath = (obj, path, val) => {
  const parts = path.split(".");
  let o = obj;
  for (let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
};

/* ---------------------- Référentiels dérivés ---------------------- */
const lignesN1 = () => uniq(REF.lignesMetiers.map(x=>x.n1));
const lignesN2 = n1 => REF.lignesMetiers.filter(x=>x.n1===n1).map(x=>x.n2);
const ligneBeta = (n1,n2) => { const r = REF.lignesMetiers.find(x=>x.n1===n1&&x.n2===n2); return r? r.beta : null; };
const ligneGroupe = (n1,n2) => { const r = REF.lignesMetiers.find(x=>x.n1===n1&&x.n2===n2); return r? r.groupe_activites : ""; };

const procList = () => { const m=new Map(); REF.processus.forEach(p=>m.set(p.code_process,p.libelle_process)); return [...m.entries()]; };
const sousProcList = code => { const m=new Map(); REF.processus.filter(p=>p.code_process===code).forEach(p=>m.set(p.code_sous_process,p.libelle_sous_process)); return [...m.entries()]; };
const activiteList = code => uniq(REF.processus.filter(p=>p.code_sous_process===code).map(p=>p.activite));

const catN1List = () => uniq(REF.categoriesCBI.map(x=>x.n1));
const catN2List = n1 => uniq(REF.categoriesCBI.filter(x=>x.n1===n1).map(x=>x.n2));
const catN3List = (n1,n2) => REF.categoriesCBI.filter(x=>x.n1===n1 && x.n2===n2);
const catDetail = (n1,n2,n3) => REF.categoriesCBI.find(x=>x.n1===n1 && x.n2===n2 && x.n3===n3);

const causeN1List = () => uniq(REF.causes.map(x=>x.n1));
const causeN2List = n1 => REF.causes.filter(x=>x.n1===n1);

const consN1List = () => uniq(REF.consequences.map(x=>x.n1));
const consN2List = n1 => REF.consequences.filter(x=>x.n1===n1);
const natureOptions = () => uniq(REF.consequences.map(x=>x.n2));

const echelleByNiveau = n => REF.echelleImpact.find(x=>String(x.niveau)===String(n));

/* ---------------------- Stockage local ---------------------- */
const STORE_KEY = "giro_incidents_v1";
const PIN_KEY = "giro_pin_v1";

function loadAll(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch(e){ return []; } }
function saveAll(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
function saveIncident(inc){
  inc.updated_at = new Date().toISOString();
  const all = loadAll();
  const idx = all.findIndex(i=>i.id===inc.id);
  if (idx>=0) all[idx]=inc; else all.push(inc);
  saveAll(all);
}
function deleteIncidentById(id){ saveAll(loadAll().filter(i=>i.id!==id)); }
function getIncidentById(id){ return loadAll().find(i=>i.id===id); }

function nextReference(){
  const year = new Date().getFullYear();
  const count = loadAll().filter(i => i.reference && i.reference.startsWith("INC-"+year)).length;
  return "INC-" + year + "-" + String(count+1).padStart(4,"0");
}

function newIncident(){
  return {
    id: uid("inc"),
    reference: nextReference(),
    statut: "brouillon",
    libelle: "", initiateur: "", direction_emettrice: "",
    ligne_metier_n1: "", ligne_metier_n2: "",
    processus_code: "", processus_libelle: "", sous_process_code: "", sous_process_libelle: "", activite: "",
    cat_n1: "", cat_n2: "", cat_n3: "",
    nature_incident: "",
    ror: { rorc:false, rorm:false, rorl:false },
    localisations: [{type:"interne",departement:""},{type:"interne",departement:""},{type:"interne",departement:""}],
    date_detection: "", date_declaration: "", date_survenance: "",
    description_litterale: "", actions_immediates: "",
    acteurs: { analyste_cpro:"", acteur_pilote:"", validateur_n2:"" },
    analyse_recommandations: "",
    causes: [], consequences: [], actions: [],
    finance: {
      estimation_initiale: {montant:"",devise:"XOF",date:"",commentaire:""},
      montant_direct_a:    {montant:"",devise:"XOF",date:"",commentaire:""},
      manque_a_gagner_b:   {montant:"",devise:"XOF",date:"",commentaire:""},
      couts_additionnels_c:{montant:"",devise:"XOF",date:"",commentaire:""},
      montant_recupere_d:  {montant:"",devise:"XOF",date:"",commentaire:""},
      montant_provisionne: {montant:"",devise:"XOF",date:"",commentaire:""}
    },
    created_at: new Date().toISOString(), updated_at: new Date().toISOString()
  };
}

/* ---------------------- État applicatif ---------------------- */
let CUR = null;             // incident en cours d'édition
let STEP = 1;                // étape du wizard (1..4)
let VIEW = "list";           // list | wizard | dashboard
const app = document.getElementById("app");

/* ---------------------- Toast ---------------------- */
let toastTimer;
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------------------- Rendu : coquille ---------------------- */
function render(){
  const statusPill = navigator.onLine ? "En ligne" : "Hors ligne — données locales";
  app.innerHTML = `
    <header class="topbar">
      <div class="brand"><span class="mark">RO</span> GIRO — Gestion des Incidents de Risque Opérationnel</div>
      <span class="status-pill">${statusPill}</span>
      <div class="spacer"></div>
      <button class="icon-btn no-print" id="btn-dashboard">Tableau de bord</button>
      <button class="icon-btn no-print" id="btn-list">Registre</button>
      <button class="icon-btn no-print" id="btn-new">+ Nouvel incident</button>
      <button class="icon-btn no-print" id="btn-security">🔒 Sécurité</button>
    </header>
    <main id="main"></main>
  `;
  document.getElementById("btn-dashboard").onclick = ()=>{ VIEW="dashboard"; render(); };
  document.getElementById("btn-list").onclick = ()=>{ VIEW="list"; render(); };
  document.getElementById("btn-new").onclick = ()=>{ CUR = newIncident(); STEP=1; VIEW="wizard"; render(); };
  document.getElementById("btn-security").onclick = openSecurityDialog;

  const main = document.getElementById("main");
  if (VIEW === "list") renderList(main);
  else if (VIEW === "dashboard") renderDashboard(main);
  else if (VIEW === "wizard") renderWizard(main);
}

/* ---------------------- Vue : Registre ---------------------- */
function renderList(main){
  const all = loadAll().sort((a,b)=> (b.updated_at||"").localeCompare(a.updated_at||""));
  main.innerHTML = `
    <div class="registry-toolbar">
      <input type="search" id="search" placeholder="Rechercher un incident (référence, libellé, initiateur)…">
      <select id="filter-statut">
        <option value="">Tous les statuts</option>
        <option value="brouillon">Brouillon</option>
        <option value="soumis">Soumis</option>
        <option value="en_analyse">En analyse</option>
        <option value="valide_n2">Validé N2</option>
        <option value="cloture">Clôturé</option>
        <option value="rejete">Rejeté</option>
      </select>
      <button class="btn" id="btn-import">Importer JSON</button>
      <button class="btn" id="btn-export-all">Exporter tout (JSON)</button>
      <input type="file" id="file-import" accept="application/json" style="display:none">
    </div>
    <div class="registry-list" id="reg-list"></div>
  `;
  const listEl = document.getElementById("reg-list");

  function paint(){
    const q = (document.getElementById("search").value||"").toLowerCase();
    const st = document.getElementById("filter-statut").value;
    const filtered = all.filter(i=>{
      const hay = (i.reference+" "+i.libelle+" "+i.initiateur).toLowerCase();
      return hay.includes(q) && (!st || i.statut===st);
    });
    if (!filtered.length){
      listEl.innerHTML = `<div class="empty-state"><div class="mark">📋</div>
        <p>Aucun incident enregistré pour l'instant.</p>
        <button class="btn btn-primary" id="empty-new">Déclarer un incident</button></div>`;
      document.getElementById("empty-new").onclick = ()=>{ CUR=newIncident(); STEP=1; VIEW="wizard"; render(); };
      return;
    }
    listEl.innerHTML = filtered.map(i=>{
      const eff = computeEffectif(i.finance);
      return `<div class="reg-item" data-id="${i.id}">
        <span class="ref">${esc(i.reference)}</span>
        <span class="titre">${esc(i.libelle)||"(sans libellé)"}</span>
        <span class="meta">${esc(i.ligne_metier_n1||"—")} · ${eff!==null?fmtMoney(eff):"—"}</span>
        <span class="status-badge status-${i.statut}">${statutLabel(i.statut)}</span>
      </div>`;
    }).join("");
    listEl.querySelectorAll(".reg-item").forEach(el=>{
      el.onclick = ()=>{ CUR = getIncidentById(el.dataset.id); STEP=1; VIEW="wizard"; render(); };
    });
  }
  document.getElementById("search").oninput = paint;
  document.getElementById("filter-statut").onchange = paint;
  document.getElementById("btn-export-all").onclick = ()=> downloadFile("giro_incidents_export.json", JSON.stringify(all,null,2), "application/json");
  document.getElementById("btn-import").onclick = ()=> document.getElementById("file-import").click();
  document.getElementById("file-import").onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        const arr = Array.isArray(data) ? data : [data];
        const existing = loadAll();
        arr.forEach(inc=>{ if(!existing.find(x=>x.id===inc.id)) existing.push(inc); });
        saveAll(existing);
        toast("Import réussi : " + arr.length + " incident(s)");
        render();
      }catch(err){ toast("Fichier JSON invalide"); }
    };
    reader.readAsText(f);
  };
  paint();
}

function statutLabel(s){
  return {brouillon:"Brouillon", soumis:"Soumis", en_analyse:"En analyse", valide_n2:"Validé N2", cloture:"Clôturé", rejete:"Rejeté"}[s] || s;
}

/* ---------------------- Vue : Tableau de bord ---------------------- */
function renderDashboard(main){
  const all = loadAll();
  const totalEff = all.reduce((s,i)=> s + (computeEffectif(i.finance)||0), 0);
  const byStatut = {};
  all.forEach(i=> byStatut[i.statut] = (byStatut[i.statut]||0)+1);
  const criticites = {};
  all.forEach(i=> (i.consequences||[]).forEach(c=>{ if(c.criticite) criticites[c.criticite]=(criticites[c.criticite]||0)+1; }));

  main.innerHTML = `
    <h2 style="margin-bottom:1rem;">Tableau de bord</h2>
    <div class="dashboard-grid">
      <div class="kpi"><div class="val">${all.length}</div><div class="lbl">Incidents enregistrés</div></div>
      <div class="kpi"><div class="val">${fmtMoney(totalEff)}</div><div class="lbl">Cumul montant effectif</div></div>
      <div class="kpi"><div class="val">${byStatut.soumis||0}</div><div class="lbl">En attente d'analyse</div></div>
      <div class="kpi"><div class="val">${byStatut.valide_n2||0}</div><div class="lbl">Validés N2</div></div>
    </div>
    <div class="card">
      <h3>Répartition par niveau de criticité (conséquences)</h3>
      <div class="grid g-4" style="margin-top:.6rem;">
        ${REF.echelleImpact.map(e=>`

/* ---------------------- Vue : Wizard (fiche incident) ---------------------- */
const STEPS = [
  {n:1, label:"1. Identification"},
  {n:2, label:"2. Analyse qualitative"},
  {n:3, label:"3. Analyse quantitative"},
  {n:4, label:"4. Plan d'actions"}
];

function renderWizard(main){
  main.innerHTML = `
    <div class="toolbar no-print">
      <strong style="font-family:Georgia,serif;color:var(--green-900);font-size:1.1rem;">${esc(CUR.reference)}</strong>
      <span class="status-badge status-${CUR.statut}">${statutLabel(CUR.statut)}</span>
      <div class="spacer" style="flex:1;"></div>
      <button class="btn" id="btn-print">🖨 Imprimer / PDF</button>
      <button class="btn" id="btn-export-csv">Exporter CSV</button>
      <button class="btn" id="btn-export-xlsx">Exporter Excel</button>
      <button class="btn btn-danger" id="btn-delete">Supprimer</button>
      <button class="btn btn-primary" id="btn-save">💾 Enregistrer</button>
    </div>
    <div class="steps no-print">
      ${STEPS.map(s=>`<div class="step-pill ${s.n===STEP?'active':(s.n<STEP?'done':'')}" data-step="${s.n}">${s.label}</div>`).join("")}
    </div>
    <div id="step-body"></div>
    <div class="footer-nav no-print">
      <button class="btn" id="btn-prev" ${STEP===1?"disabled":""}>← Précédent</button>
      <div style="display:flex;gap:.5rem;">
        <button class="btn" id="btn-back-list">Retour au registre</button>
        ${STEP<4 ? '<button class="btn btn-gold" id="btn-next">Suivant →</button>' : '<button class="btn btn-primary" id="btn-submit">Soumettre / clôturer</button>'}
      </div>
    </div>
  `;
  main.querySelectorAll(".step-pill").forEach(el=> el.onclick = ()=>{ STEP=+el.dataset.step; render(); });
  document.getElementById("btn-prev").onclick = ()=>{ STEP=Math.max(1,STEP-1); render(); };
  const nextBtn = document.getElementById("btn-next");
  if (nextBtn) nextBtn.onclick = ()=>{ STEP=Math.min(4,STEP+1); render(); };
  const submitBtn = document.getElementById("btn-submit");
  if (submitBtn) submitBtn.onclick = ()=>{ CUR.statut = "soumis"; saveIncident(CUR); toast("Incident soumis pour analyse"); render(); };
  document.getElementById("btn-back-list").onclick = ()=>{ VIEW="list"; render(); };
  document.getElementById("btn-save").onclick = ()=>{ saveIncident(CUR); toast("Incident enregistré"); };
  document.getElementById("btn-delete").onclick = ()=>{
    if(confirm("Supprimer définitivement cet incident ?")){ deleteIncidentById(CUR.id); VIEW="list"; render(); toast("Incident supprimé"); }
  };
  document.getElementById("btn-print").onclick = ()=> printIncident(CUR);
  document.getElementById("btn-export-csv").onclick = ()=> exportCSV(CUR);
  document.getElementById("btn-export-xlsx").onclick = ()=> exportXLSX(CUR);

  const body = document.getElementById("step-body");
  if (STEP===1) renderStep1(body);
  else if (STEP===2) renderStep2(body);
  else if (STEP===3) renderStep3(body);
  else if (STEP===4) renderStep4(body);
}

/* ---------- Champs génériques liés (data-path) ---------- */
function bindGenericInputs(container){
  container.querySelectorAll("[data-path]").forEach(el=>{
    const val = getPath(CUR, el.dataset.path);
    if (el.type === "checkbox") el.checked = !!val;
    else el.value = val ?? "";
    const evt = (el.tagName==="SELECT" || el.type==="date" || el.type==="checkbox") ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const v = el.type==="checkbox" ? el.checked : el.value;
      setPath(CUR, el.dataset.path, v);
    });
  });
}

  {key:"manque_a_gagner_b", label:"Manque à Gagner (B)"},
