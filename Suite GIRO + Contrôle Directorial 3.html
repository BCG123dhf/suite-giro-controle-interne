  {key:"montant_recupere_d", label:"Montant récupéré (D)"},
  {key:"montant_provisionne", label:"Montant Provisionné"}
];

function computeEffectif(fin){
  if (!fin) return null;
  const n = k => parseFloat(fin[k]?.montant) || 0;
  const hasAny = ["montant_direct_a","manque_a_gagner_b","couts_additionnels_c","montant_recupere_d"].some(k=>fin[k]?.montant!=="");
  if (!hasAny) return null;
  return n("montant_direct_a") + n("manque_a_gagner_b") + n("couts_additionnels_c") - n("montant_recupere_d");
}

/* ---------------------- Export : téléchargement générique ---------------------- */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ---------------------- Export CSV ---------------------- */
function exportCSV(inc){
  const rows = [];

  add("Processus", inc.processus_libelle); add("Sous-processus", inc.sous_process_libelle); add("Activité", inc.activite);

  rows.push([]); rows.push(["--- CAUSES ---"]);
  rows.push(["Réf","Libellé","Localisation","Département","Cause N1","Cause N2","Description"]);
  inc.causes.forEach(c=> rows.push([c.ref,c.libelle,c.loc_type,c.departement,c.cause_n1,c.cause_n2,c.description]));
  rows.push([]); rows.push(["--- CONSÉQUENCES ---"]);
  rows.push(["Réf","Catégorie N1","Catégorie N2","Description","Criticité"]);
  inc.consequences.forEach(c=> rows.push([c.ref,c.cat_n1,c.cat_n2,c.description, echelleByNiveau(c.criticite)?.libelle||c.criticite]));
  rows.push([]); rows.push(["--- ÉVALUATION FINANCIÈRE ---"]);
  rows.push(["Type","Montant","Devise","Date","Commentaire"]);
  FIN_ROWS.forEach(r=>{ const v=inc.finance[r.key]; rows.push([r.label,v.montant,v.devise,v.date,v.commentaire]); });

  rows.push([]); rows.push(["--- PLAN D'ACTIONS ---"]);

  const csv = rows.map(r=> r.map(v=>`"${(v??"").toString().replace(/"/g,'""')}"`).join(";")).join("\n");
  downloadFile(`${inc.reference}.csv`, "\uFEFF"+csv, "text/csv;charset=utf-8");

/* ---------------------- Sécurité / PIN ---------------------- */
function openSecurityDialog(){
  const hasPin = !!localStorage.getItem(PIN_KEY);
  const action = hasPin
    ? confirm("Un code PIN est actif. Cliquez sur OK pour le retirer, ou Annuler pour le conserver.")
    : confirm("Aucun code PIN défini. Cliquez sur OK pour en définir un (verrouille l'accès à l'application).");
  if (hasPin && action){ localStorage.removeItem(PIN_KEY); sessionStorage.removeItem("giro_unlocked"); toast("Code PIN retiré"); return; }
  if (!hasPin && action){
    const pin = prompt("Définir un code PIN à 4 chiffres :");
    if (pin && /^\d{4}$/.test(pin)){ localStorage.setItem(PIN_KEY, btoa(pin)); sessionStorage.setItem("giro_unlocked","1"); toast("Code PIN activé"); }
    else if (pin) toast("Le code doit contenir exactement 4 chiffres");
  }
}

function checkPinGate(){
  const pinHash = localStorage.getItem(PIN_KEY);
  if (!pinHash || sessionStorage.getItem("giro_unlocked")==="1"){ render(); return; }
  renderPinScreen(pinHash);
}

function renderPinScreen(pinHash){
  let entry = "";
  app.innerHTML = `
    <div class="pin-screen"><div class="pin-card">
      <div class="mark">RO</div>
      <h2 style="color:var(--green-900);">GIRO verrouillé</h2>
      <p style="color:var(--ink-soft);font-size:.85rem;">Saisissez le code PIN pour accéder à vos incidents.</p>
      <div class="pin-dots" id="pin-dots">${"0000".split("").map(()=>'<span></span>').join("")}</div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
      </div>
      <div class="pin-error" id="pin-error"></div>
    </div></div>`;
  const dots = document.getElementById("pin-dots").children;
  const err = document.getElementById("pin-error");
  document.querySelectorAll(".pin-pad button").forEach(btn=>{
    btn.onclick = ()=>{
      const n = btn.dataset.n;
      if (n === "⌫"){ entry = entry.slice(0,-1); }
      else if (n !== "" && entry.length<4){ entry += n; }
      for (let i=0;i<4;i++) dots[i].classList.toggle("filled", i<entry.length);
      if (entry.length===4){
        if (btoa(entry)===pinHash){ sessionStorage.setItem("giro_unlocked","1"); render(); }
        else { err.textContent="Code incorrect"; entry=""; setTimeout(()=>{ for (let i=0;i<4;i++) dots[i].classList.remove("filled"); },400); }
      } else { err.textContent=""; }
    };
  });
}

/* ---------------------- Démarrage ---------------------- */
window.addEventListener("online", render);
window.addEventListener("offline", render);
checkPinGate();

})();

.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--pr)}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.84rem;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.85}
.bp{background:var(--pr);color:#fff}.ba{background:var(--ac);color:#fff}.bo{background:var(--ok);color:#fff}
.br{background:var(--err);color:#fff;font-size:.74rem;padding:4px 9px}
.bw{background:var(--wa);color:#fff}.bsm{padding:5px 9px;font-size:.76rem}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600;white-space:nowrap}
.bg{background:#E3ECE4;color:#3F6B4C}.br2{background:#F5E1DB;color:#9A3E22}
.bo2{background:#F3E7D3;color:#93691E}.bb{background:#E9E5DF;color:#6B6259}.bp2{background:#EAE0E6;color:#5B3256}
.al{padding:9px 12px;border-radius:7px;font-size:.82rem;margin-bottom:10px}
.al-w{background:#F3E7D3;border-left:4px solid var(--wa);color:#7A5A16}
.al-d{background:#F5E1DB;border-left:4px solid var(--err);color:#7C2E17}
.al-s{background:#E3ECE4;border-left:4px solid var(--ok);color:#335A40}
.al-i{background:#EDE3E0;border-left:4px solid var(--pr);color:#6E1E2B}
.tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.empty{text-align:center;padding:36px;color:var(--mu)}
.empty .ei{font-size:2.2rem;margin-bottom:8px}
#mtog{display:none;align-items:center;gap:7px;background:var(--pr);color:#fff;border:none;padding:7px 12px;border-radius:6px;cursor:pointer;margin-bottom:14px;font-size:.84rem}
.hm{display:grid;grid-template-columns:auto repeat(5,1fr);gap:3px;font-size:.72rem;max-width:520px}
.hm .hd{font-weight:700;text-align:center;padding:6px 2px;color:var(--mu)}
.hm .rl{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mu);writing-mode:vertical-rl;transform:rotate(180deg)}
.hm .cell{border-radius:5px;padding:10px 4px;text-align:center;font-weight:700;color:#fff;min-height:36px;display:flex;align-items:center;justify-content:center}
.c-g{background:#4B7A5B}.c-o{background:#B8862B}.c-r{background:#B7472A}.c-p{background:#5B3256}
.sod-conflict{background:#F5E1DB;border-left:4px solid var(--err);color:#7C2E17;padding:9px 12px;border-radius:7px;font-size:.82rem;margin-bottom:8px}
.sod-ok{background:#E3ECE4;border-left:4px solid var(--ok);color:#335A40;padding:9px 12px;border-radius:7px;font-size:.82rem}
.stepbox{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.stepnum{background:var(--pr);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:.85rem}
.pbar{background:#F3F0EC;border-radius:20px;height:8px;overflow:hidden;width:100%}
.pbar span{display:block;height:100%;background:var(--ok);border-radius:20px}
@media(max-width:680px){:root{--sw:0px}#sb{transform:translateX(-240px);width:240px}#sb.open{transform:translateX(0)}#main{margin-left:0;padding:14px}#mtog{display:flex}.hm{font-size:.62rem}}
</style>
</head>
<body>
<aside id="sb">
  <div class="logo"><h2>🇧🇫 Contrôle Directorial</h2><p>Gestion des Risques & Contrôle Interne</p></div>
  <nav>
    <a class="active" onclick="sp('db')"><span class="ico">📊</span> Tableau de Bord</a>
    <a onclick="sp('carto')"><span class="ico">🗺️</span> Cartographie des Risques</a>
    <a onclick="sp('ctrl')"><span class="ico">🛡️</span> Dispositif de Contrôle</a>
    <a onclick="sp('sod')"><span class="ico">🧩</span> Séparation des Tâches</a>
    <a onclick="sp('act')"><span class="ico">✅</span> Plan d'Actions</a>
    <a onclick="sp('inc')"><span class="ico">🚨</span> Incidents & Fraude</a>
    <a onclick="sp('aud')"><span class="ico">🔍</span> Revues & Audits</a>
    <a onclick="sp('guide')"><span class="ico">📖</span> Guide Méthodologique</a>
  </nav>
</aside>
<main id="main">
<button id="mtog" onclick="document.getElementById('sb').classList.toggle('open')">☰ Menu</button>

<div class="pg on" id="pg-db">
  <div class="ph"><h1>📊 Tableau de Bord Directorial</h1><p>Vue d'ensemble du risque et de la maîtrise de l'entreprise — à date du jour</p></div>
  <div class="kpi-grid" id="kpi-grid"></div>
  <div class="grid2">
    <div class="card"><h3>🔥 Alertes du Jour</h3><div id="alerts-list"></div></div>
    <div class="card"><h3>🗺️ Matrice des Risques (Probabilité × Impact)</h3><div id="mini-heatmap"></div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>⚠️ Top 5 Risques Résiduels</h3><div id="top-risks"></div></div>
    <div class="card"><h3>📌 Actions Prioritaires en Retard</h3><div id="top-actions"></div></div>
  </div>
</div>

<div class="pg" id="pg-carto">
  <div class="ph"><h1>🗺️ Cartographie des Risques</h1><p>Identifiez, évaluez et suivez chaque risque susceptible d'affecter vos objectifs</p></div>

  <div class="card"><h3>➕ Nouveau Risque</h3>
    <div class="fr">
      <div class="fg"><label>Référence</label><input id="r-ref" placeholder="R09"></div>
      <div class="fg" style="flex:2"><label>Description du risque</label><input id="r-desc" placeholder="Ex: Rupture de stock des articles à forte rotation"></div>
      <div class="fg"><label>Catégorie</label>
        <select id="r-cat">
          <option>Financier</option><option>Opérationnel</option><option>Conformité</option>
          <option>Fraude</option><option>Stratégique</option><option>Ressources Humaines</option><option>Informatique</option>
        </select>
      </div>
    </div>
    <div class="fr">
      <div class="fg" style="flex:2"><label>Cause principale</label><input id="r-cause" placeholder="Ex: Absence de seuil de réapprovisionnement"></div>
      <div class="fg"><label>Probabilité (1-5)</label><select id="r-proba"><option value="1">1 – Rare</option><option value="2">2 – Peu probable</option><option value="3" selected>3 – Possible</option><option value="4">4 – Probable</option><option value="5">5 – Quasi certain</option></select></div>
      <div class="fg"><label>Impact (1-5)</label><select id="r-imp"><option value="1">1 – Négligeable</option><option value="2">2 – Mineur</option><option value="3" selected>3 – Modéré</option><option value="4">4 – Majeur</option><option value="5">5 – Critique</option></select></div>
    </div>
    <div class="fr">
      <div class="fg" style="flex:2"><label>Mesures de maîtrise existantes</label><input id="r-mes" placeholder="Ex: Inventaire hebdomadaire + stock minimum défini"></div>
      <div class="fg"><label>Efficacité des mesures</label><select id="r-eff"><option value="1">Aucune</option><option value="0.8">Faible</option><option value="0.5" selected>Moyenne</option><option value="0.25">Forte</option></select></div>
      <div class="fg"><label>Responsable</label><input id="r-resp" placeholder="Ex: Gérant"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Statut</label><select id="r-stat"><option>Identifié</option><option>En traitement</option><option selected>Sous surveillance</option><option>Maîtrisé</option><option>Accepté</option></select></div>
      <div class="fg"><label>Prochaine revue</label><input type="date" id="r-date"></div>
    </div>
    <button class="btn bp" onclick="addRisque()">Ajouter au registre</button>
  </div>

  <div class="card">
    <div class="tb"><h3 style="border:none;margin:0;padding:0">📋 Registre des Risques</h3><span class="badge bb" id="carto-count">0 risques</span></div>
    <div style="overflow-x:auto"><table id="carto-table"><thead><tr>
      <th>Réf.</th><th>Risque</th><th>Catégorie</th><th>Brut (P×I)</th><th>Efficacité mesures</th><th>Résiduel</th><th>Responsable</th><th>Statut</th><th>Revue</th><th></th>
    </tr></thead><tbody></tbody></table></div>
    <div id="carto-empty" style="display:none" class="empty"><div class="ei">🗂️</div>Aucun risque enregistré pour le moment.</div>
  </div>

  <div class="card"><h3>🌡️ Matrice de Chaleur Complète</h3><p style="font-size:.78rem;color:var(--mu);margin-bottom:10px">Répartition du nombre de risques bruts par case de probabilité et d'impact.</p><div id="full-heatmap"></div></div>
</div>

<div class="pg" id="pg-ctrl">
  <div class="ph"><h1>🛡️ Dispositif de Contrôle Interne</h1><p>Les contrôles mis en place pour maîtriser chaque risque identifié</p></div>

  <div class="card"><h3>➕ Nouveau Contrôle</h3>
    <div class="fr">
      <div class="fg"><label>Risque associé</label><select id="c-ref"></select></div>
      <div class="fg" style="flex:2"><label>Intitulé du contrôle</label><input id="c-int" placeholder="Ex: Comptage physique hebdomadaire de la caisse"></div>
      <div class="fg"><label>Type</label><select id="c-type"><option>Préventif</option><option>Détectif</option><option>Correctif</option></select></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Fréquence</label><select id="c-freq"><option>Quotidien</option><option>Hebdomadaire</option><option>Mensuel</option><option>Trimestriel</option><option>Annuel</option><option>Ponctuel</option></select></div>
      <div class="fg"><label>Responsable exécution</label><input id="c-exec" placeholder="Ex: Caissière"></div>
      <div class="fg"><label>Responsable supervision</label><input id="c-superv" placeholder="Ex: Gérant"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Dernière exécution</label><input type="date" id="c-date"></div>
      <div class="fg"><label>Statut d'efficacité</label><select id="c-stat"><option>Efficace</option><option>Partiellement efficace</option><option>Défaillant</option><option>Non testé</option></select></div>
    </div>
    <button class="btn bp" onclick="addControle()">Ajouter le contrôle</button>
  </div>

  <div class="card">
    <div class="tb"><h3 style="border:none;margin:0;padding:0">📋 Registre des Contrôles</h3><span class="badge bb" id="ctrl-count">0 contrôles</span></div>
    <div style="overflow-x:auto"><table id="ctrl-table"><thead><tr>
      <th>Risque lié</th><th>Contrôle</th><th>Type</th><th>Fréquence</th><th>Exécutant</th><th>Superviseur</th><th>Dernière exéc.</th><th>Statut</th><th></th>
    </tr></thead><tbody></tbody></table></div>
    <div id="ctrl-empty" style="display:none" class="empty"><div class="ei">🛡️</div>Aucun contrôle enregistré pour le moment.</div>
  </div>

  <div class="card"><h3>🧱 Les 5 Composantes du Contrôle Interne (COSO simplifié)</h3>
    <div style="font-size:.84rem;line-height:1.75">
      <p><strong>1. Environnement de contrôle</strong><br>La culture, l'exemplarité du dirigeant et l'organisation générale qui donnent le ton du contrôle interne.</p>
      <hr style="margin:9px 0;border:none;border-top:1px solid var(--bd)">
      <p><strong>2. Évaluation des risques</strong><br>L'identification et l'analyse régulière des risques susceptibles d'affecter les objectifs (voir Cartographie).</p>
      <hr style="margin:9px 0;border:none;border-top:1px solid var(--bd)">
      <p><strong>3. Activités de contrôle</strong><br>Les procédures concrètes : séparation des tâches, autorisations, rapprochements, vérifications physiques.</p>
      <hr style="margin:9px 0;border:none;border-top:1px solid var(--bd)">
      <p><strong>4. Information et communication</strong><br>Des données fiables qui circulent à temps entre les employés, le gérant et les partenaires (banque, comptable).</p>
      <hr style="margin:9px 0;border:none;border-top:1px solid var(--bd)">
      <p><strong>5. Pilotage / Supervision</strong><br>La vérification périodique que les contrôles fonctionnent réellement, par le dirigeant ou un audit externe.</p>
    </div>
  </div>
</div>

<div class="pg" id="pg-sod">
  <div class="ph"><h1>🧩 Séparation des Tâches</h1><p>Attribuez chaque fonction sensible à un responsable et détectez automatiquement les cumuls incompatibles</p></div>

  <div class="card"><h3>👤 Attribution des Fonctions</h3>
    <p style="font-size:.78rem;color:var(--mu);margin-bottom:12px">Indiquez le nom (ou le poste) de la personne qui exerce chaque fonction dans votre entreprise.</p>
    <div id="sod-form"></div>
    <button class="btn bp" style="margin-top:6px" onclick="analyseSod()">Analyser les cumuls</button>
  </div>

  <div class="card"><h3>🚦 Résultat de l'Analyse</h3><div id="sod-result"><div class="empty"><div class="ei">🧩</div>Renseignez les fonctions puis lancez l'analyse.</div></div></div>

  <div class="card"><h3>📚 Pourquoi séparer les tâches ?</h3>
    <div class="al al-i">💡 <strong>Principe :</strong> une même personne ne devrait jamais pouvoir <em>engager</em>, <em>exécuter</em> et <em>enregistrer</em> seule une même opération. Le cumul de ces rôles est la porte ouverte la plus fréquente à la fraude en PME.</div>
    <div class="al al-w">⚡ Dans les très petites structures où un seul poste cumule plusieurs fonctions par nécessité, la supervision rapprochée et régulière du dirigeant doit compenser l'absence de séparation.</div>
  </div>
</div>

<div class="pg" id="pg-act">
  <div class="ph"><h1>✅ Plan d'Actions</h1><p>Suivez la mise en œuvre des recommandations issues des risques, contrôles, incidents et audits</p></div>

  <div class="card"><h3>➕ Nouvelle Action</h3>
    <div class="fr">
      <div class="fg"><label>Origine</label><input id="a-orig" placeholder="Ex: Risque R03 / Audit 2026-T1"></div>
      <div class="fg" style="flex:2"><label>Intitulé de l'action</label><input id="a-int" placeholder="Ex: Mettre en place un compte Mobile Money dédié à l'entreprise"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Responsable</label><input id="a-resp" placeholder="Ex: Gérant"></div>
      <div class="fg"><label>Priorité</label><select id="a-prio"><option>Haute</option><option selected>Moyenne</option><option>Basse</option></select></div>
      <div class="fg"><label>Échéance</label><input type="date" id="a-ech"></div>
      <div class="fg"><label>Avancement (%)</label><input type="number" id="a-avc" min="0" max="100" value="0"></div>
    </div>
    <button class="btn bp" onclick="addAction()">Ajouter l'action</button>
  </div>

  <div class="card">
    <div class="tb"><h3 style="border:none;margin:0;padding:0">📋 Suivi des Actions</h3><span class="badge bb" id="act-count">0 actions</span></div>
    <div style="overflow-x:auto"><table id="act-table"><thead><tr>
      <th>Origine</th><th>Action</th><th>Responsable</th><th>Priorité</th><th>Échéance</th><th>Avancement</th><th>Statut</th><th></th>
    </tr></thead><tbody></tbody></table></div>
    <div id="act-empty" style="display:none" class="empty"><div class="ei">✅</div>Aucune action en cours.</div>
  </div>
</div>

<div class="pg" id="pg-inc">
  <div class="ph"><h1>🚨 Incidents & Fraude</h1><p>Recensez tout événement anormal — perte, vol, détournement, erreur significative — dès sa détection</p></div>

  <div class="card"><h3>➕ Déclarer un Incident</h3>
    <div class="fr">
      <div class="fg"><label>Date</label><input type="date" id="i-date"></div>
      <div class="fg"><label>Nature</label><select id="i-nat"><option>Détournement / Vol</option><option>Fraude au paiement</option><option>Erreur significative</option><option>Perte de marchandise</option><option>Non-conformité réglementaire</option><option>Autre</option></select></div>
      <div class="fg"><label>Montant estimé (FCFA)</label><input type="number" id="i-mnt" placeholder="0"></div>
    </div>
    <div class="fr">
      <div class="fg" style="flex:3"><label>Description des faits</label><input id="i-desc" placeholder="Ex: Écart de caisse de 45 000 FCFA constaté lors du comptage du vendredi"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Statut de l'enquête</label><select id="i-stat"><option>Signalé</option><option>En investigation</option><option>Classé sans suite</option><option>Sanctionné / Recouvré</option></select></div>
      <div class="fg" style="flex:2"><label>Mesures prises</label><input id="i-mes" placeholder="Ex: Entretien avec le caissier, mise à pied conservatoire"></div>
    </div>
    <button class="btn bp" onclick="addIncident()">Enregistrer l'incident</button>
  </div>

  <div class="card">
    <div class="tb"><h3 style="border:none;margin:0;padding:0">📋 Registre des Incidents</h3><span class="badge bb" id="inc-count">0 incidents</span></div>
    <div style="overflow-x:auto"><table id="inc-table"><thead><tr>
      <th>Date</th><th>Nature</th><th>Description</th><th>Montant</th><th>Statut</th><th>Mesures</th><th></th>
    </tr></thead><tbody></tbody></table></div>
    <div id="inc-empty" style="display:none" class="empty"><div class="ei">🚨</div>Aucun incident recensé. C'est excellent, restez vigilant !</div>
  </div>
</div>

<div class="pg" id="pg-aud">
  <div class="ph"><h1>🔍 Revues & Audits</h1><p>Planifiez et documentez les revues internes et externes de votre dispositif de maîtrise</p></div>

  <div class="card"><h3>➕ Nouvelle Revue / Audit</h3>
    <div class="fr">
      <div class="fg"><label>Date</label><input type="date" id="ad-date"></div>
      <div class="fg"><label>Type</label><select id="ad-type"><option>Auto-évaluation dirigeant</option><option>Revue de direction</option><option>Audit interne</option><option>Audit externe / Commissaire</option></select></div>
      <div class="fg" style="flex:2"><label>Périmètre couvert</label><input id="ad-perim" placeholder="Ex: Caisse, stocks et crédits clients"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Nombre de constats</label><input type="number" id="ad-nb" value="0" min="0"></div>
      <div class="fg" style="flex:3"><label>Synthèse</label><input id="ad-synth" placeholder="Ex: Bonne tenue de caisse, faiblesse constatée sur le suivi des stocks"></div>
    </div>
    <div class="fr">
      <div class="fg"><label>Statut</label><select id="ad-stat"><option>Planifiée</option><option>Réalisée</option><option>Clôturée</option></select></div>
    </div>
    <button class="btn bp" onclick="addAudit()">Enregistrer</button>
  </div>

  <div class="card">
    <div class="tb"><h3 style="border:none;margin:0;padding:0">📋 Historique des Revues</h3><span class="badge bb" id="aud-count">0 revues</span></div>
    <div style="overflow-x:auto"><table id="aud-table"><thead><tr>
      <th>Date</th><th>Type</th><th>Périmètre</th><th>Constats</th><th>Synthèse</th><th>Statut</th><th></th>
    </tr></thead><tbody></tbody></table></div>
    <div id="aud-empty" style="display:none" class="empty"><div class="ei">🔍</div>Aucune revue enregistrée.</div>
  </div>
</div>

<div class="pg" id="pg-guide">
  <div class="ph"><h1>📖 Guide Méthodologique</h1><p>Les principes de gestion des risques et de contrôle interne adaptés à la PME burkinabè</p></div>

  <div class="grid2">
    <div class="card"><h3>🔄 Le Cycle de Gestion des Risques</h3>
      <div class="stepbox"><div class="stepnum">1</div><div><strong>Identifier</strong><br><span style="font-size:.82rem;color:var(--mu)">Lister tout événement pouvant empêcher l'entreprise d'atteindre ses objectifs (financier, opérationnel, humain, réglementaire).</span></div></div>
      <div class="stepbox"><div class="stepnum">2</div><div><strong>Évaluer</strong><br><span style="font-size:.82rem;color:var(--mu)">Estimer la probabilité de survenance et l'impact si le risque se réalise, pour prioriser l'action.</span></div></div>
      <div class="stepbox"><div class="stepnum">3</div><div><strong>Traiter</strong><br><span style="font-size:.82rem;color:var(--mu)">Choisir une stratégie : éviter, réduire, transférer (assurance) ou accepter le risque en connaissance de cause.</span></div></div>
      <div class="stepbox"><div class="stepnum">4</div><div><strong>Surveiller</strong><br><span style="font-size:.82rem;color:var(--mu)">Revoir périodiquement le registre des risques et vérifier que les mesures de maîtrise restent efficaces.</span></div></div>
    </div>
    <div class="card"><h3>🎯 Les 4 Stratégies de Traitement</h3>
      <table><tbody>
        <tr><td><span class="badge bg">Éviter</span></td><td style="font-size:.82rem">Supprimer l'activité à l'origine du risque (ex: cesser de vendre à crédit à un client douteux).</td></tr>
        <tr><td><span class="badge bb">Réduire</span></td><td style="font-size:.82rem">Mettre en place un contrôle qui abaisse la probabilité ou l'impact (ex: comptage quotidien de caisse).</td></tr>
        <tr><td><span class="badge bo2">Transférer</span></td><td style="font-size:.82rem">Faire porter le risque par un tiers (assurance vol/incendie, garantie fournisseur).</td></tr>
        <tr><td><span class="badge br2">Accepter</span></td><td style="font-size:.82rem">Assumer consciemment un risque faible dont le coût de traitement dépasserait le bénéfice.</td></tr>
      </tbody></table>
    </div>
  </div>

  <div class="card"><h3>📏 Échelles d'Évaluation (1 à 5)</h3>
    <div class="grid2">
      <div>
        <p style="font-size:.8rem;font-weight:700;color:var(--mu);margin-bottom:6px">PROBABILITÉ</p>
        <table><tbody>
          <tr><td>1</td><td>Rare</td><td style="font-size:.76rem;color:var(--mu)">Ne s'est jamais produit</td></tr>
          <tr><td>2</td><td>Peu probable</td><td style="font-size:.76rem;color:var(--mu)">S'est produit une fois en plusieurs années</td></tr>
          <tr><td>3</td><td>Possible</td><td style="font-size:.76rem;color:var(--mu)">Peut survenir dans l'année</td></tr>

    <div class="al al-i">💡 <strong>Règle d'or :</strong> "Le contrôle interne ne cherche pas à accuser, il protège l'honnête et dissuade le malhonnête."</div>

<script>
// ================= STORAGE =================
const STORAGE_KEY = 'cdc_pme_data_v1';

function defRisques(){return[
  {ref:'R01',desc:"Détournement d'espèces en caisse par un employé",cat:'Fraude',cause:"Absence de comptage contradictoire quotidien",proba:3,imp:5,mes:"Arrêté de caisse quotidien signé par le gérant",eff:0.5,resp:'Gérant',stat:'Sous surveillance',date:'2026-08-15'},
  {ref:'R02',desc:"Paiement Mobile Money détourné via un compte personnel",cat:'Fraude',cause:"Compte Orange Money/Moov Money non dédié à l'entreprise",proba:3,imp:4,mes:"Ouverture d'un compte marchand au nom de l'entreprise",eff:0.5,resp:'Dirigeant',stat:'En traitement',date:'2026-07-30'},
  {ref:'R03',desc:"Rupture de stock des articles à forte rotation",cat:'Opérationnel',cause:"Absence de seuil de réapprovisionnement défini",proba:4,imp:3,mes:"Inventaire hebdomadaire et stock minimum par article",eff:0.5,resp:'Responsable stock',stat:'Sous surveillance',date:'2026-08-01'},
  {ref:'R04',desc:"Créances clients impayées au-delà de 60 jours",cat:'Financier',cause:"Absence de suivi formalisé des échéances de crédit",proba:4,imp:4,mes:"Carnet de crédits clients avec relance à J+7/J+14/J+30",eff:0.5,resp:'Gérant',stat:'En traitement',date:'2026-07-20'},
  {ref:'R05',desc:"Redressement fiscal pour défaut de déclaration TVA/CNSS",cat:'Conformité',cause:"Méconnaissance des échéances déclaratives",proba:2,imp:5,mes:"Calendrier fiscal et suivi mensuel avec le comptable",eff:0.25,resp:'Comptable',stat:'Maîtrisé',date:'2026-09-01'},
  {ref:'R06',desc:"Achat fictif avec un fournisseur complice d'un employé",cat:'Fraude',cause:"Absence de triple rapprochement bon de commande / réception / facture",proba:2,imp:4,mes:"Rapprochement systématique avant tout paiement fournisseur",eff:0.5,resp:'Gérant',stat:'Sous surveillance',date:'2026-08-10'},
  {ref:'R07',desc:"Départ d'un employé clé sans transmission des accès et procédures",cat:'Ressources Humaines',cause:"Absence de documentation des procédures et de double accès",proba:3,imp:3,mes:"Fiches de procédure écrites et accès partagés aux outils critiques",eff:0.8,resp:'Dirigeant',stat:'Identifié',date:'2026-08-25'},
  {ref:'R08',desc:"Perte de données de gestion (téléphone/ordinateur volé ou en panne)",cat:'Informatique',cause:"Absence de sauvegarde régulière des données",proba:3,imp:4,mes:"Sauvegarde hebdomadaire sur un second support ou le cloud",eff:0.5,resp:'Gérant',stat:'En traitement',date:'2026-08-05'},
];}

function defControles(){return[
  {ref:'R01',intitule:'Comptage contradictoire de la caisse en fin de journée',type:'Détectif',freq:'Quotidien',exec:'Caissière',superv:'Gérant',date:'2026-07-01',stat:'Efficace'},
  {ref:'R02',intitule:'Vérification mensuelle du relevé Mobile Money marchand',type:'Détectif',freq:'Mensuel',exec:'Comptable',superv:'Dirigeant',date:'2026-06-28',stat:'Partiellement efficace'},
  {ref:'R03',intitule:'Inventaire physique hebdomadaire des articles à forte rotation',type:'Préventif',freq:'Hebdomadaire',exec:'Responsable stock',superv:'Gérant',date:'2026-06-30',stat:'Efficace'},
  {ref:'R04',intitule:'Relance systématique des crédits clients à J+7',type:'Correctif',freq:'Hebdomadaire',exec:'Gérant',superv:'Dirigeant',date:'2026-06-25',stat:'Partiellement efficace'},
  {ref:'R06',intitule:'Triple rapprochement avant validation du paiement fournisseur',type:'Préventif',freq:'Ponctuel',exec:'Comptable',superv:'Gérant',date:'2026-06-20',stat:'Non testé'},
];}

function defActions(){return[
  {orig:'Risque R02',intitule:"Ouvrir un compte Mobile Money marchand dédié à l'entreprise",resp:'Dirigeant',prio:'Haute',ech:'2026-07-20',avc:40},
  {orig:'Risque R04',intitule:'Formaliser un carnet de crédits clients avec échéancier',resp:'Gérant',prio:'Haute',ech:'2026-07-15',avc:60},
  {orig:'Audit 2026-T1',intitule:"Rédiger les fiches de procédure des postes clés",resp:'Dirigeant',prio:'Moyenne',ech:'2026-08-30',avc:10},
  {orig:'Risque R08',intitule:'Mettre en place une sauvegarde hebdomadaire des données',resp:'Gérant',prio:'Moyenne',ech:'2026-06-15',avc:0},
];}

function defIncidents(){return[
  {date:'2026-05-14',nat:'Détournement / Vol',desc:"Écart de caisse de 32 000 FCFA constaté lors du comptage du vendredi",mnt:32000,stat:'Sanctionné / Recouvré',mes:"Entretien avec la caissière, remboursement échelonné, renforcement du comptage quotidien"},
];}

function defAudits(){return[
  {date:'2026-04-10',type:'Auto-évaluation dirigeant',perim:'Caisse, stocks et crédits clients',nb:4,synth:'Bonne tenue de la caisse ; faiblesse constatée sur le suivi des crédits clients et absence de sauvegarde numérique',stat:'Clôturée'},
];}

let S = {
  risques: defRisques(),
  controles: defControles(),
  actions: defActions(),
  incidents: defIncidents(),
  audits: defAudits(),
  sod: {}
};

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); S = Object.assign(S, parsed); }
  }catch(e){ console.warn('Chargement des données impossible, valeurs par défaut utilisées.'); }
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){ console.warn('Sauvegarde impossible.'); }
}

// ================= UTILS =================
const fmt = n => (n||0).toLocaleString('fr-FR');
const td = () => new Date().toISOString().split('T')[0];
const $ = id => document.getElementById(id);

function niveau(score){
  if(score>=16) return {l:'Critique',c:'p2',cls:'bp2',cell:'c-p'};
  if(score>=10) return {l:'Élevé',c:'r',cls:'br2',cell:'c-r'};
  if(score>=5)  return {l:'Modéré',c:'o',cls:'bo2',cell:'c-o'};
  return {l:'Faible',c:'g',cls:'bg',cell:'c-g'};
}

// ================= NAV =================
function sp(n){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('#sb nav a').forEach(a=>a.classList.remove('active'));
  $('pg-'+n).classList.add('on');
  document.querySelectorAll('#sb nav a').forEach(a=>{ if(a.getAttribute('onclick')?.includes("'"+n+"'")) a.classList.add('active'); });
  if(n==='db') rDB();
  if(n==='carto') rCarto();
  if(n==='ctrl') rCtrl();
  if(n==='sod') rSodForm();
  if(n==='act') rAct();
  if(n==='inc') rInc();
  if(n==='aud') rAud();
  if(window.innerWidth<680) $('sb').classList.remove('open');
}

// ================= DASHBOARD =================
function scoreBrut(r){ return r.proba*r.imp; }
function scoreResiduel(r){ return Math.round(r.proba*r.imp*r.eff); }

function rDB(){
  const rq = S.risques;
  const critiques = rq.filter(r=>niveau(scoreResiduel(r)).l==='Critique').length;
  const eleves = rq.filter(r=>niveau(scoreResiduel(r)).l==='Élevé').length;
  const moyBrut = rq.length? Math.round(rq.reduce((a,r)=>a+scoreBrut(r),0)/rq.length*10)/10 : 0;
  const moyRes = rq.length? Math.round(rq.reduce((a,r)=>a+scoreResiduel(r),0)/rq.length*10)/10 : 0;
  const ctrlDef = S.controles.filter(c=>c.stat==='Défaillant').length;
  const actRet = S.actions.filter(a=>a.avc<100 && a.ech && new Date(a.ech)<new Date()).length;
  const incOuv = S.incidents.filter(i=>i.stat==='Signalé'||i.stat==='En investigation').length;

  const kpis=[
    {l:'Risques Critiques + Élevés',v:(critiques+eleves),s:critiques+' critique(s), '+eleves+' élevé(s)',c:(critiques+eleves)?'r':'g'},
    {l:'Score de Risque Moyen',v:moyRes+' / 25',s:'Brut moyen : '+moyBrut,c:moyRes>=10?'r':moyRes>=5?'o':'g'},
    {l:'Contrôles Défaillants',v:ctrlDef,s:S.controles.length+' contrôle(s) au total',c:ctrlDef?'r':'g'},
    {l:'Actions en Retard',v:actRet,s:S.actions.length+' action(s) planifiée(s)',c:actRet?'r':'g'},
    {l:'Incidents Ouverts',v:incOuv,s:S.incidents.length+' incident(s) au total',c:incOuv?'o':'g'},
  ];
  $('kpi-grid').innerHTML = kpis.map(k=>`<div class="kpi ${k.c}"><div class="lbl">${k.l}</div><div class="val">${k.v}</div><div class="sub">${k.s}</div></div>`).join('');

  // Alerts
  let als=[];
  if(critiques>0) als.push(['al-d', `🟣 ${critiques} risque(s) au niveau CRITIQUE nécessitent un traitement immédiat`]);
  if(ctrlDef>0) als.push(['al-d', `🛡️ ${ctrlDef} contrôle(s) jugé(s) défaillant(s) — révision urgente requise`]);
  if(actRet>0) als.push(['al-w', `📌 ${actRet} action(s) du plan sont en retard sur leur échéance`]);
  if(incOuv>0) als.push(['al-w', `🚨 ${incOuv} incident(s) encore en cours d'investigation`]);
  const revuesDues = rq.filter(r=>r.date && new Date(r.date)<new Date());
  if(revuesDues.length) als.push(['al-w', `🔁 ${revuesDues.length} revue(s) de risque arrivée(s) à échéance : ${revuesDues.map(r=>r.ref).join(', ')}`]);
  if(!als.length) als.push(['al-s', '✅ Aucune alerte critique détectée aujourd\'hui']);
  $('alerts-list').innerHTML = als.map(a=>`<div class="al ${a[0]}" style="margin-bottom:7px">${a[1]}</div>`).join('');

  // Mini heatmap (reuse full heatmap renderer at smaller scale)
  $('mini-heatmap').innerHTML = buildHeatmap(true);
  $('full-heatmap') && ($('full-heatmap').innerHTML = buildHeatmap(false));

  // Top 5 risques résiduels
  const top = [...rq].sort((x,y)=>scoreResiduel(y)-scoreResiduel(x)).slice(0,5);
  $('top-risks').innerHTML = top.length ? top.map(r=>{
    const n = niveau(scoreResiduel(r));
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.8rem">
      <span><strong>${r.ref}</strong> — ${r.desc}</span><span class="badge ${n.cls}">${n.l} (${scoreResiduel(r)})</span></div>`;
  }).join('') : '<div class="empty" style="padding:14px"><div class="ei">✅</div>Aucun risque enregistré.</div>';

  // Actions prioritaires en retard
  const actRetList = S.actions.filter(a=>a.avc<100 && a.ech && new Date(a.ech)<new Date()).sort((x,y)=>new Date(x.ech)-new Date(y.ech));
  $('top-actions').innerHTML = actRetList.length ? actRetList.map(a=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.8rem">
      <span><strong>${a.orig}</strong> — ${a.intitule}</span><span class="badge br2">Échéance ${a.ech}</span></div>`).join('')
    : '<div class="empty" style="padding:14px"><div class="ei">✅</div>Aucune action en retard.</div>';
}

function buildHeatmap(){
  let cellsCount = {};
  S.risques.forEach(r=>{ const k=r.proba+'-'+r.imp; cellsCount[k]=(cellsCount[k]||0)+1; });
  let rows='';
  rows += `<div class="hd"></div>`+[1,2,3,4,5].map(i=>`<div class="hd">I${i}</div>`).join('');
  for(let p=5;p>=1;p--){
    rows += `<div class="rl">P${p}</div>`;
    for(let i=1;i<=5;i++){
      const sc = p*i; const n = niveau(sc); const cnt = cellsCount[p+'-'+i]||0;
      rows += `<div class="cell ${n.cell}" title="Probabilité ${p} × Impact ${i} = ${sc}">${cnt>0?cnt:''}</div>`;
    }
  }
  return `<div class="hm">${rows}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:.72rem;color:var(--mu)">
    <span><span style="display:inline-block;width:10px;height:10px;background:#4B7A5B;border-radius:2px;margin-right:4px"></span>Faible</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#B8862B;border-radius:2px;margin-right:4px"></span>Modéré</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#B7472A;border-radius:2px;margin-right:4px"></span>Élevé</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#5B3256;border-radius:2px;margin-right:4px"></span>Critique</span>
  </div>`;
}

// ================= CARTOGRAPHIE DES RISQUES =================
function addRisque(){
  const ref = $('r-ref').value.trim() || ('R'+String(S.risques.length+1).padStart(2,'0'));
  const desc = $('r-desc').value.trim();
  if(!desc) return alert('La description du risque est obligatoire.');
  S.risques.push({
    ref, desc, cat:$('r-cat').value, cause:$('r-cause').value.trim(),
    proba:parseInt($('r-proba').value), imp:parseInt($('r-imp').value),
    mes:$('r-mes').value.trim(), eff:parseFloat($('r-eff').value),
    resp:$('r-resp').value.trim()||'Non désigné', stat:$('r-stat').value, date:$('r-date').value||''
  });
  ['r-ref','r-desc','r-cause','r-mes','r-resp','r-date'].forEach(id=>$(id).value='');
  saveData(); rCarto(); refreshRiskSelect();
}
function delRisque(i){ if(confirm('Supprimer ce risque du registre ?')){ S.risques.splice(i,1); saveData(); rCarto(); refreshRiskSelect(); } }

function rCarto(){
  $('carto-count').textContent = S.risques.length + (S.risques.length>1?' risques':' risque');
  const tb = document.querySelector('#carto-table tbody');
  if(!S.risques.length){ tb.innerHTML=''; $('carto-empty').style.display='block'; return; }
  $('carto-empty').style.display='none';
  tb.innerHTML = S.risques.map((r,i)=>{
    const sb=scoreBrut(r), sr=scoreResiduel(r), nb=niveau(sb), nr=niveau(sr);
    return `<tr>
      <td><strong>${r.ref}</strong><br><span class="badge bb" style="margin-top:3px">${r.cat}</span></td>
      <td style="max-width:220px">${r.desc}${r.cause?`<br><span style="font-size:.72rem;color:var(--mu)">Cause : ${r.cause}</span>`:''}</td>
      <td>${r.cat}</td>
      <td><span class="badge ${nb.cls}">${nb.l} (${sb})</span></td>
      <td style="font-size:.76rem">${r.mes||'—'}<br><span style="color:var(--mu)">Efficacité : ${r.eff==1?'Aucune':r.eff==0.8?'Faible':r.eff==0.5?'Moyenne':'Forte'}</span></td>
      <td><span class="badge ${nr.cls}">${nr.l} (${sr})</span></td>
      <td>${r.resp}</td>
      <td><span class="badge bb">${r.stat}</span></td>
      <td style="font-size:.76rem">${r.date||'—'}</td>
      <td><button class="btn br bsm" onclick="delRisque(${i})">✕</button></td>
    </tr>`;
  }).join('');
}

// ================= DISPOSITIF DE CONTROLE =================
function refreshRiskSelect(){
  const sel = $('c-ref'); if(!sel) return;
  sel.innerHTML = S.risques.map(r=>`<option value="${r.ref}">${r.ref} — ${r.desc.slice(0,40)}${r.desc.length>40?'…':''}</option>`).join('') || '<option value="">Aucun risque enregistré</option>';
}
function addControle(){
  const intitule = $('c-int').value.trim();
  if(!intitule) return alert('L\'intitulé du contrôle est obligatoire.');
  S.controles.push({
    ref:$('c-ref').value, intitule, type:$('c-type').value, freq:$('c-freq').value,
    exec:$('c-exec').value.trim()||'Non désigné', superv:$('c-superv').value.trim()||'Non désigné',
    date:$('c-date').value||'', stat:$('c-stat').value
  });
  ['c-int','c-exec','c-superv','c-date'].forEach(id=>$(id).value='');
  saveData(); rCtrl();
}
function delControle(i){ if(confirm('Supprimer ce contrôle ?')){ S.controles.splice(i,1); saveData(); rCtrl(); } }

function rCtrl(){
  refreshRiskSelect();
  $('ctrl-count').textContent = S.controles.length + (S.controles.length>1?' contrôles':' contrôle');
  const tb = document.querySelector('#ctrl-table tbody');
  if(!S.controles.length){ tb.innerHTML=''; $('ctrl-empty').style.display='block'; return; }
  $('ctrl-empty').style.display='none';
  const statCls = {'Efficace':'bg','Partiellement efficace':'bo2','Défaillant':'br2','Non testé':'bb'};
  tb.innerHTML = S.controles.map((c,i)=>`<tr>
      <td><span class="badge bb">${c.ref||'—'}</span></td>
      <td style="max-width:200px">${c.intitule}</td>
      <td>${c.type}</td>
      <td>${c.freq}</td>
      <td>${c.exec}</td>
      <td>${c.superv}</td>
      <td style="font-size:.76rem">${c.date||'—'}</td>
      <td><span class="badge ${statCls[c.stat]||'bb'}">${c.stat}</span></td>
      <td><button class="btn br bsm" onclick="delControle(${i})">✕</button></td>
    </tr>`).join('');
}

// ================= SEPARATION DES TACHES =================
const SOD_FUNCTIONS = [
  'Autoriser les dépenses','Exécuter les paiements','Comptabiliser les opérations',
  'Négocier avec les fournisseurs','Réceptionner les marchandises','Gérer le stock physique',
  'Encaisser les ventes','Suivre et relancer les créances clients',
  'Recruter le personnel','Calculer et payer les salaires'
];
const SOD_CONFLICTS = [
  ['Autoriser les dépenses','Exécuter les paiements'],
  ['Exécuter les paiements','Comptabiliser les opérations'],
  ['Négocier avec les fournisseurs','Réceptionner les marchandises'],
  ['Encaisser les ventes','Comptabiliser les opérations'],
  ['Gérer le stock physique','Comptabiliser les opérations'],
  ['Recruter le personnel','Calculer et payer les salaires'],
];

function rSodForm(){
  const box = $('sod-form');
  box.innerHTML = SOD_FUNCTIONS.map(f=>`
    <div class="fr" style="margin-bottom:2px">
      <div class="fg" style="flex:2"><label style="margin-bottom:2px">${f}</label>
      <input data-fn="${f}" class="sod-input" value="${S.sod[f]||''}" placeholder="Nom ou poste"></div>
    </div>`).join('');
}
function analyseSod(){
  document.querySelectorAll('.sod-input').forEach(inp=>{ S.sod[inp.getAttribute('data-fn')] = inp.value.trim(); });
  saveData();
  let conflicts = [];
  SOD_CONFLICTS.forEach(pair=>{
    const p1 = S.sod[pair[0]], p2 = S.sod[pair[1]];
    if(p1 && p2 && p1.toLowerCase()===p2.toLowerCase()){
      conflicts.push(`<strong>${p1}</strong> cumule « ${pair[0]} » et « ${pair[1]} » — fonctions incompatibles.`);
    }
  });
  const res = $('sod-result');
  if(conflicts.length){
    res.innerHTML = conflicts.map(c=>`<div class="sod-conflict">⚠️ ${c}</div>`).join('') +
      `<div class="al al-i" style="margin-top:8px">💡 Renforcez la supervision directe du dirigeant sur ces fonctions tant que le cumul persiste.</div>`;
  } else {
    res.innerHTML = `<div class="sod-ok">✅ Aucun cumul incompatible détecté sur les fonctions renseignées.</div>`;
  }
}

// ================= PLAN D'ACTIONS =================
function addAction(){
  const intitule = $('a-int').value.trim();
  if(!intitule) return alert('L\'intitulé de l\'action est obligatoire.');
  S.actions.push({
    orig:$('a-orig').value.trim()||'—', intitule, resp:$('a-resp').value.trim()||'Non désigné',
    prio:$('a-prio').value, ech:$('a-ech').value||'', avc:parseInt($('a-avc').value)||0
  });
  ['a-orig','a-int','a-resp','a-ech'].forEach(id=>$(id).value=''); $('a-avc').value=0;
  saveData(); rAct();
}
function delAction(i){ if(confirm('Supprimer cette action ?')){ S.actions.splice(i,1); saveData(); rAct(); } }
function majAvancement(i,v){ S.actions[i].avc = Math.max(0,Math.min(100,parseInt(v)||0)); saveData(); rAct(); }

function statutAction(a){
  if(a.avc>=100) return {l:'Fait',c:'bg'};
  if(a.ech && new Date(a.ech)<new Date()) return {l:'En retard',c:'br2'};
  if(a.avc>0) return {l:'En cours',c:'bo2'};
  return {l:'À faire',c:'bb'};
}
function rAct(){
  $('act-count').textContent = S.actions.length + (S.actions.length>1?' actions':' action');
  const tb = document.querySelector('#act-table tbody');
  if(!S.actions.length){ tb.innerHTML=''; $('act-empty').style.display='block'; return; }
  $('act-empty').style.display='none';
  const prioCls={'Haute':'br2','Moyenne':'bo2','Basse':'bb'};
  tb.innerHTML = S.actions.map((a,i)=>{
    const st = statutAction(a);
    return `<tr>
      <td>${a.orig}</td>
      <td style="max-width:220px">${a.intitule}</td>
      <td>${a.resp}</td>
      <td><span class="badge ${prioCls[a.prio]}">${a.prio}</span></td>
      <td style="font-size:.76rem">${a.ech||'—'}</td>
      <td style="min-width:120px">
        <div class="pbar"><span style="width:${a.avc}%"></span></div>
        <input type="number" min="0" max="100" value="${a.avc}" style="width:60px;margin-top:4px;padding:3px 5px;font-size:.72rem;border:1px solid var(--bd);border-radius:4px" onchange="majAvancement(${i},this.value)"> %
      </td>
      <td><span class="badge ${st.c}">${st.l}</span></td>
      <td><button class="btn br bsm" onclick="delAction(${i})">✕</button></td>
    </tr>`;
  }).join('');
}

  });
  ['i-date','i-mnt','i-desc','i-mes'].forEach(id=>$(id).value='');
  saveData(); rInc();
}
function delIncident(i){ if(confirm('Supprimer cet incident ?')){ S.incidents.splice(i,1); saveData(); rInc(); } }

function rInc(){
  $('inc-count').textContent = S.incidents.length + (S.incidents.length>1?' incidents':' incident');
  const tb = document.querySelector('#inc-table tbody');
  if(!S.incidents.length){ tb.innerHTML=''; $('inc-empty').style.display='block'; return; }
  $('inc-empty').style.display='none';
  const statCls={'Signalé':'bo2','En investigation':'br2','Classé sans suite':'bb','Sanctionné / Recouvré':'bg'};
  tb.innerHTML = S.incidents.map((inc,i)=>`<tr>
      <td style="font-size:.76rem">${inc.date}</td>
      <td>${inc.nat}</td>
      <td style="max-width:220px">${inc.desc}</td>
      <td>${fmt(inc.mnt)} F</td>

      <td><button class="btn br bsm" onclick="delIncident(${i})">✕</button></td>
    </tr>`).join('');
}

<script>
(function(){
  const load = id => document.getElementById(id).textContent.split('<@@/script').join('</script');
  const tabs = {giro:{btn:'tab-giro',fr:'fr-giro',src:'mod-giro',loaded:false}, cdc:{btn:'tab-cdc',fr:'fr-cdc',src:'mod-cdc',loaded:false}};
  function show(k){
    Object.keys(tabs).forEach(n=>{
      const t=tabs[n], on=n===k;
      document.getElementById(t.btn).classList.toggle('on',on);
      const fr=document.getElementById(t.fr); fr.classList.toggle('on',on);
      if(on && !t.loaded){ fr.srcdoc = load(t.src); t.loaded=true; }
    });
    try{ localStorage.setItem('suite_tab_v1',k); }catch(e){}
  }
  document.getElementById('tab-giro').onclick=()=>show('giro');
  document.getElementById('tab-cdc').onclick=()=>show('cdc');
  let start='giro'; try{ const s=localStorage.getItem('suite_tab_v1'); if(tabs[s]) start=s; }catch(e){}
  show(start);
})();
</script>
